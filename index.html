Topics": ["Viết email cho đồng nghiệp thông báo lịch họp nhóm bị dời sang tuần sau, nêu rõ lý do và ngày giờ mới.", "Viết thư cho nhà cung cấp khiếu nại về việc giao hàng chậm trễ, yêu cầu họ phản hồi trong 3 ngày.", "Viết email cho khách hàng xác nhận đơn đặt hàng và thông tin giao hàng dự kiến.", "Viết thư xin nghỉ phép gửi quản lý, nêu rõ lý do và thời gian nghỉ.", "Viết email mời đối tác tham dự sự kiện ra mắt sản phẩm mới của công ty."], "task2Topics": ["Some people prefer to work for a large company, while others prefer a small company. Which do you prefer? Give reasons.", "Many companies now allow employees to work from home. Do the advantages of remote work outweigh the disadvantages?", "Some believe that advertising has a negative effect on society. To what extent do you agree or disagree?", "In your opinion, what qualities make a good manager? Explain your answer with reasons and examples.", "Online shopping is becoming more popular than shopping in physical stores. Discuss the advantages and disadvantages."]}</script>
<script>
const QUESTIONS = JSON.parse(document.getElementById('data-holder').textContent);
const VOCAB = JSON.parse(document.getElementById('vocab-holder').textContent);
const CW = JSON.parse(document.getElementById('cw-holder').textContent);
const WGUIDE = JSON.parse(document.getElementById('writing-guide-holder').textContent);
const DE_COUNT = 5;

// ---- derive dạng list with counts ----
const dangMap = {};
QUESTIONS.forEach(q=>{
  if(!dangMap[q.dang]) dangMap[q.dang] = {key:q.dang, name:q.dangTen, count:0, phan:q.phan};
  dangMap[q.dang].count++;
});
const dangList = Object.values(dangMap).sort((a,b)=> b.count - a.count);

// ---- level lock: tier map (1=Cơ bản, 2=Trung cấp, 3=Nâng cao) ----
const TIER_MAP = {
  'A':1, 'B':1, 'E':1, 'I':1, 'F1':1, 'F2':1, 'F5':1,
  'C':2, 'D':2, 'F':2, 'G':2, 'F3':2, 'F4':2, 'F7':2,
  'H':3, 'J':3, 'F6':3,
};
const TIER_NAMES = {1:'Cơ bản', 2:'Trung cấp', 3:'Nâng cao'};

function tierStats(tier){
  const keys = Object.keys(TIER_MAP).filter(k=>TIER_MAP[k]===tier);
  const codes = QUESTIONS.filter(q=>keys.includes(q.dang)).map(q=>q.code);
  const done = codes.filter(c=>progress[c]);
  const correct = done.filter(c=>progress[c].lastCorrect===true).length;
  const pct = done.length ? correct/done.length : 0;
  return {total: codes.length, done: done.length, correct, pct};
}
function isTierUnlocked(tier){
  if(tier===1) return true;
  const prev = tierStats(tier-1);
  const need = Math.ceil(prev.total*0.5);
  return prev.done >= need && prev.pct >= 0.7;
}

// ---- progress store (public version: local device only, no account sync) ----
let progress = {}; // code -> {attempts, correct, lastCorrect}
let vocabProgress = {}; // "word|direction" -> {seen, known}
let playerStats = {xp:0, streak:0, lastVisit:null};
let syncOn = false; // this build never syncs to an account — always false

function loadLocal(){
  try{
    const raw = localStorage.getItem('vstep_progress_v1');
    if(raw) progress = JSON.parse(raw);
  }catch(e){}
  try{
    const raw2 = localStorage.getItem('vstep_vocab_progress_v1');
    if(raw2) vocabProgress = JSON.parse(raw2);
  }catch(e){}
  try{
    const raw3 = localStorage.getItem('vstep_player_stats_v1');
    if(raw3) playerStats = JSON.parse(raw3);
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem('vstep_progress_v1', JSON.stringify(progress)); }catch(e){}
  try{ localStorage.setItem('vstep_vocab_progress_v1', JSON.stringify(vocabProgress)); }catch(e){}
  try{ localStorage.setItem('vstep_player_stats_v1', JSON.stringify(playerStats)); }catch(e){}
}

function persistProgress(){
  saveLocal();
}

function updateSyncBadge(){
  const lbl = document.getElementById('synclbl');
  if(lbl) lbl.textContent = 'Lưu trên máy này (bản chia sẻ công khai)';
}

// ---- XP / Level / Streak ----
function levelOf(xp){ return Math.floor(xp/100)+1; }
function addXP(n){
  playerStats.xp += n;
  persistProgress();
  updateStatsBar();
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function checkStreak(){
  const today = todayStr();
  if(playerStats.lastVisit === today) return;
  if(playerStats.lastVisit){
    const prev = new Date(playerStats.lastVisit);
    const cur = new Date(today);
    const diffDays = Math.round((cur-prev)/(1000*60*60*24));
    playerStats.streak = (diffDays === 1) ? playerStats.streak + 1 : 1;
  } else {
    playerStats.streak = 1;
  }
  playerStats.lastVisit = today;
  persistProgress();
}
function updateStatsBar(){
  const bar = document.getElementById('statsbar');
  if(!bar) return;
  const lvl = levelOf(playerStats.xp);
  const inLevel = playerStats.xp % 100;
  bar.innerHTML = `
    <div class="lvl">🏆 Cấp ${lvl}</div>
    <div class="xpbar"><div class="xpbar-fill" style="width:${inLevel}%"></div></div>
    <div class="streak">🔥 ${playerStats.streak} ngày</div>
  `;
}

function recordAnswer(code, correct){
  const p = progress[code] || {attempts:0, correct:0, lastCorrect:null};
  p.attempts++;
  if(correct) p.correct++;
  p.lastCorrect = correct;
  progress[code] = p;
  persistProgress();
}

function recordVocab(word, direction, known){
  const key = word+'|'+direction;
  const p = vocabProgress[key] || {seen:0, known:0, lastKnown:null};
  p.seen++;
  if(known) p.known++;
  p.lastKnown = known;
  vocabProgress[key] = p;
  persistProgress();
}

// ---- utils ----
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function byCode(code){ return QUESTIONS.find(q=>q.code===code); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function heartsHtml(n){
  return `<span class="hearts">${'❤️'.repeat(Math.max(0,n))}${'🖤'.repeat(Math.max(0,5-n))}</span>`;
}

// ---- app state ----
let session = null;
let flashSession = null;
let typeSession = null;
let matchSession = null;
let cwSession = null; // {list, idx, score, hearts}
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');

tabsEl.addEventListener('click', (e)=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  [...tabsEl.children].forEach(c=>c.classList.remove('active'));
  t.classList.add('active');
  session = null;
  flashSession = null;
  typeSession = null;
  matchSession = null;
  cwSession = null;
  if(t.dataset.tab === 'home') renderHome();
  else if(t.dataset.tab === 'vocab') renderVocabHome();
  else if(t.dataset.tab === 'writing') renderWritingHome();
  else renderDashboard();
});

// ==================== NGỮ PHÁP ====================
function renderHome(){
  const wrongCodes = Object.keys(progress).filter(c=>progress[c].lastCorrect===false);
  app.innerHTML = `
    <div class="card">
      <div class="sync-badge" style="margin-bottom:12px">
        <span class="dot" id="syncdot"></span><span id="synclbl">Lưu trên máy này</span>
      </div>
      <b style="font-size:14px;display:block;margin-bottom:10px">Ôn theo Đề (mô phỏng thi thật)</b>
      <div class="grid" id="de-grid"></div>
    </div>
    ${renderTierSectionsHTML()}
    <div class="card">
      <b style="font-size:14px;display:block;margin-bottom:10px">Khác</b>
      <div class="grid">
        <div class="chip-btn" id="btn-all"><b>Ôn ngẫu nhiên</b><small>Cả 100 câu, trộn ngẫu nhiên</small></div>
        <div class="chip-btn" id="btn-wrong"><b>Chỉ câu đã sai</b><small>${wrongCodes.length} câu cần ôn lại</small></div>
      </div>
    </div>
  `;
  updateSyncBadge();
  const deGrid = document.getElementById('de-grid');
  for(let de=1; de<=DE_COUNT; de++){
    const codes = QUESTIONS.filter(q=>q.de===de).map(q=>q.code);
    const done = codes.filter(c=>progress[c]).length;
    const div = document.createElement('div');
    div.className='chip-btn';
    div.innerHTML = `<b>Đề tổng hợp ${de}</b><small>20 câu · đã làm ${done}/20</small>`;
    div.onclick = ()=> startSession(codes, `Đề tổng hợp ${de}`, true);
    deGrid.appendChild(div);
  }
  populateTierGrids();
  document.getElementById('btn-all').onclick = ()=>{
    startSession(shuffle(QUESTIONS.map(q=>q.code)), 'Ôn ngẫu nhiên 100 câu', false);
  };
  document.getElementById('btn-wrong').onclick = ()=>{
    if(wrongCodes.length===0){ alert('Bạn chưa có câu nào sai — hãy làm vài đề trước đã.'); return; }
    startSession(shuffle(wrongCodes), 'Ôn lại câu đã sai', false);
  };
}

function renderTierSectionsHTML(){
  let html = '';
  for(let tier=1; tier<=3; tier++){
    const unlocked = isTierUnlocked(tier);
    let lockNote = '';
    if(!unlocked){
      const stats = tierStats(tier-1);
      const need = Math.ceil(stats.total*0.5);
      const pctNow = stats.done ? Math.round(stats.pct*100) : 0;
      lockNote = `<span style="font-size:11px;color:var(--text-2)">🔒 Cần ≥${need} câu &amp; ≥70% đúng ở Bậc ${tier-1} (hiện: ${stats.done} câu, ${pctNow}%)</span>`;
    }
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        <b style="font-size:14px">Bậc ${tier} — ${TIER_NAMES[tier]}</b>
        ${lockNote}
      </div>
      <div class="grid" id="dang-tier-${tier}"></div>
    </div>`;
  }
  return html;
}

function populateTierGrids(){
  for(let tier=1; tier<=3; tier++){
    const container = document.getElementById(`dang-tier-${tier}`);
    if(!container) continue;
    const unlocked = isTierUnlocked(tier);
    const items = dangList.filter(d=>TIER_MAP[d.key]===tier);
    items.forEach(d=>{
      const div = document.createElement('div');
      if(unlocked){
        div.className = 'chip-btn';
        div.innerHTML = `<b>${d.name}</b><small>${d.count} câu</small>`;
        div.onclick = ()=>{
          const codes = QUESTIONS.filter(q=>q.dang===d.key).map(q=>q.code);
          startSession(codes, d.name, false);
        };
      } else {
        div.className = 'chip-btn locked';
        div.innerHTML = `<b>🔒 ${d.name}</b><small>${d.count} câu</small>`;
      }
      container.appendChild(div);
    });
  }
}

function startSession(codes, label, timed){
  session = { codes, idx:0, score:0, label, timed, secondsLeft: timed ? 15*60 : null, timerHandle:null, hearts:5 };
  if(timed){
    session.timerHandle = setInterval(()=>{
      if(!session) return;
      session.secondsLeft--;
      const t = document.getElementById('timer-display');
      if(t) t.textContent = fmtTime(session.secondsLeft);
      if(session.secondsLeft<=0){ clearInterval(session.timerHandle); }
    }, 1000);
  }
  renderQuestion();
}

function fmtTime(s){
  if(s<0) s=0;
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function renderQuestion(){
  if(!session) return;
  const code = session.codes[session.idx];
  const q = byCode(code);
  const total = session.codes.length;
  const pct = Math.round((session.idx/total)*100);

  app.innerHTML = `
    <div class="card">
      <div class="meta-row">
        <span>${session.label} — Câu ${session.idx+1}/${total}</span>
        <span>${heartsHtml(session.hearts)}</span>
      </div>
      <div class="meta-row" style="margin-top:-6px">
        <span>${q.phan==='ED'?'Error Detection':'Sentence Completion'}</span>
        ${session.timed ? `<span class="timer" id="timer-display">${fmtTime(session.secondsLeft)}</span>` : ''}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="qtext">${escapeHtml(q.q)}</p>
      <div id="opts"></div>
      <div id="explain-holder"></div>
      <div class="btnrow" id="btnrow" style="display:none">
        <button class="primary" id="next-btn">Câu tiếp theo →</button>
      </div>
    </div>
  `;
  const optsEl = document.getElementById('opts');
  ['A','B','C','D'].forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<b>${letter}.</b> ${escapeHtml(q.opts[letter])}`;
    btn.onclick = ()=> selectAnswer(letter, q, btn);
    optsEl.appendChild(btn);
  });
  document.getElementById('next-btn').onclick = nextQuestion;
}

function selectAnswer(letter, q, btnEl){
  if(btnEl.dataset.locked) return;
  const correct = letter === q.ans;
  [...document.getElementById('opts').children].forEach(b=>{
    b.dataset.locked = '1';
    b.disabled = true;
    const l = b.querySelector('b').textContent[0];
    if(l === q.ans) b.classList.add('correct');
    else if(l === letter && !correct) b.classList.add('wrong');
  });
  const holder = document.getElementById('explain-holder');
  holder.innerHTML = `<div class="explain ${correct?'ok':'bad'}">${correct? '✓ Đúng vì: ' : ('✗ Sai. Đáp án đúng là '+q.ans+'. ')}${escapeHtml(q.expl)}</div>`;
  document.getElementById('btnrow').style.display = 'flex';
  recordAnswer(q.code, correct);
  if(correct){ session.score++; addXP(10); }
  else { session.hearts--; }
  if(session.hearts<=0){
    document.getElementById('next-btn').textContent = 'Hết tim — Xem kết quả';
  }
}

function nextQuestion(){
  if(!session) return;
  session.idx++;
  if(session.hearts<=0 || session.idx >= session.codes.length){
    if(session.timerHandle) clearInterval(session.timerHandle);
    renderSummary();
  } else {
    renderQuestion();
  }
}

function renderSummary(){
  const attempted = session.idx;
  const pct = attempted ? Math.round((session.score/attempted)*100) : 0;
  const heartsOut = session.hearts<=0;
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <p style="font-size:14px;color:var(--text-2);margin:0 0 6px">${session.label} — ${heartsOut?'Hết tim! Dừng sớm':'hoàn thành'}</p>
      <p style="font-size:34px;font-weight:700;color:var(--accent-2);margin:0 0 4px">${session.score}/${attempted}</p>
      <p style="font-size:14px;color:var(--text-2);margin:0 0 18px">${pct}% chính xác${heartsOut?` · đã làm ${attempted}/${session.codes.length} câu`:''}</p>
      <div class="btnrow">
        <button class="ghost" id="back-home">Về trang chính</button>
        <button class="primary" id="retry-btn">Làm lại</button>
      </div>
    </div>
  `;
  document.getElementById('back-home').onclick = ()=>{
    [...tabsEl.children].forEach(c=>c.classList.remove('active'));
    tabsEl.children[0].classList.add('active');
    renderHome();
  };
  document.getElementById('retry-btn').onclick = ()=> startSession(session.codes, session.label, session.timed);
}

// ---- flashcard ----
function startFlash(words, direction, label){
  flashSession = { words, idx:0, direction, flipped:false, known:0, unknown:0, label };
  renderFlashCard();
}

function renderFlashCard(){
  const fs = flashSession;
  const v = fs.words[fs.idx];
  const total = fs.words.length;
  const pct = Math.round((fs.idx/total)*100);
  const front = fs.direction==='enVn' ? v.w : v.vn;
  const frontSub = fs.direction==='enVn' ? v.pos : '';
  const back = fs.direction==='enVn' ? v.vn : (v.w + (v.ipa?'  '+v.ipa:''));

  app.innerHTML = `
    <div class="card">
      <div class="meta-row">
        <span>${fs.label} — Thẻ ${fs.idx+1}/${total}</span>
        <span>✓ ${fs.known}  ✗ ${fs.unknown}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="flash" id="flashcard">
        <div class="front">${escapeHtml(front)}</div>
        ${frontSub ? `<div class="sub">${escapeHtml(frontSub)}</div>` : ''}
        <div id="flash-back"></div>
      </div>
      <div id="flash-actions"></div>
    </div>
  `;
  const cardEl = document.getElementById('flashcard');
  const backHolder = document.getElementById('flash-back');
  const actionsHolder = document.getElementById('flash-actions');
  actionsHolder.innerHTML = `<p class="tap" style="text-align:center">Chạm vào thẻ để xem đáp án</p>`;

  cardEl.onclick = ()=>{
    if(fs.flipped) return;
    fs.flipped = true;
    backHolder.innerHTML = `
      <div class="back">${escapeHtml(back)}</div>
      <div class="ex">${escapeHtml(v.ex)}</div>
    `;
    actionsHolder.innerHTML = `
      <div class="know-row">
        <button class="know-btn no" id="know-no">✗ Chưa thuộc</button>
        <button class="know-btn yes" id="know-yes">✓ Đã thuộc</button>
      </div>
    `;
    document.getElementById('know-no').onclick = ()=> answerFlash(false);
    document.getElementById('know-yes').onclick = ()=> answerFlash(true);
  };
}

function answerFlash(known){
  const fs = flashSession;
  const v = fs.words[fs.idx];
  recordVocab(v.w, fs.direction, known);
  if(known){ fs.known++; addXP(5); } else fs.unknown++;
  fs.idx++;
  fs.flipped = false;
  if(fs.idx >= fs.words.length){
    renderFlashSummary();
  } else {
    renderFlashCard();
  }
}

function renderFlashSummary(){
  const fs = flashSession;
  const total = fs.words.length;
  const pct = Math.round((fs.known/total)*100);

// ---- typed-answer practice ----
function startType(words, mode, label){
  typeSession = { words, idx:0, mode, label, correctCount:0, wrongCount:0, hearts:5 };
  renderTypeCard();
}

function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function renderTypeCard(){
  const ts = typeSession;
  const v = ts.words[ts.idx];
  const total = ts.words.length;
  const pct = Math.round((ts.idx/total)*100);

  let promptHtml = '';
  let subHtml = '';
  if(ts.mode === 'envn'){
    promptHtml = `<div class="type-prompt">${escapeHtml(v.w)}${v.pos?` <span style="font-size:13px;color:var(--text-2);font-weight:400">(${escapeHtml(v.pos)})</span>`:''}</div>`;
    subHtml = `<div class="type-sub">Gõ nghĩa tiếng Việt của từ này — không cần đúng 100%, chỉ cần chứa đúng ý chính</div>`;
  } else if(ts.mode === 'vnen'){
    promptHtml = `<div class="type-prompt">${escapeHtml(v.vn)}</div>`;
    subHtml = `<div class="type-sub">Gõ lại từ tiếng Anh tương ứng</div>`;
  } else {
    const re = new RegExp(escapeReg(v.w), 'i');
    const marked = v.blank.replace(re, '<span class="blank-mark">______</span>');
    promptHtml = `<div class="blank-sentence">${marked}</div>`;
    subHtml = `<div class="type-sub">Điền từ/cụm từ còn thiếu (tiếng Anh)</div>`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="meta-row">
        <span>${ts.label} — Câu ${ts.idx+1}/${total}</span>
        <span>${heartsHtml(ts.hearts)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${promptHtml}
      ${subHtml}
      <input type="text" class="type-input" id="type-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời rồi bấm Kiểm tra...">
      <div id="type-feedback-holder"></div>
      <div class="btnrow" id="type-btnrow">
        <button class="primary" id="type-check-btn">Kiểm tra</button>
      </div>
    </div>
  `;
  const input = document.getElementById('type-input');
  input.focus();
  const checkBtn = document.getElementById('type-check-btn');
  const doCheck = ()=> checkTypeAnswer(v, input);
  checkBtn.onclick = doCheck;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doCheck(); } });
}

function checkTypeAnswer(v, input){
  if(input.disabled) return;
  const raw = input.value.trim();
  let correct = false;
  let correctAnswerDisplay = '';
  if(typeSession.mode === 'envn'){
    correct = raw.length>0 && raw.toLowerCase().includes(v.vnCore.toLowerCase());
    correctAnswerDisplay = v.vn;
  } else if(typeSession.mode === 'vnen'){
    correct = raw.toLowerCase() === v.w.toLowerCase();
    correctAnswerDisplay = v.w;
  } else {
    correct = raw.toLowerCase() === v.w.toLowerCase();
    correctAnswerDisplay = v.w;
  }
  input.disabled = true;
  input.classList.add(correct ? 'ok' : 'bad');
  const holder = document.getElementById('type-feedback-holder');
  let extra = '';
  if(typeSession.mode === 'envn') extra = `<br><span style="color:var(--text-2)">Ví dụ: ${escapeHtml(v.ex)}</span>`;
  holder.innerHTML = `<div class="type-feedback ${correct?'ok':'bad'}">${correct?'✓ Đúng!':'✗ Chưa đúng. Đáp án: '+escapeHtml(correctAnswerDisplay)}${extra}</div>`;

  const direction = typeSession.mode==='envn' ? 'enVn' : (typeSession.mode==='vnen' ? 'vnEn' : 'blank');
  recordVocab(v.w, direction, correct);
  if(correct){ typeSession.correctCount++; addXP(8); }
  else { typeSession.wrongCount++; typeSession.hearts--; }

  const nextLabel = typeSession.hearts<=0 ? 'Hết tim — Xem kết quả' : 'Câu tiếp theo →';
  document.getElementById('type-btnrow').innerHTML = `<button class="primary" id="type-next-btn">${nextLabel}</button>`;
  document.getElementById('type-next-btn').onclick = nextTypeCard;
}

function nextTypeCard(){
  typeSession.idx++;
  if(typeSession.hearts<=0 || typeSession.idx >= typeSession.words.length){
    renderTypeSummary();
  } else {
    renderTypeCard();
  }
}

function renderTypeSummary(){
  const ts = typeSession;
  const attempted = ts.idx;
  const pct = attempted ? Math.round((ts.correctCount/attempted)*100) : 0;
  const heartsOut = ts.hearts<=0;
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <p style="font-size:14px;color:var(--text-2);margin:0 0 6px">${ts.label} — ${heartsOut?'Hết tim! Dừng sớm':'hoàn thành'}</p>
      <p style="font-size:34px;font-weight:700;color:var(--accent-2);margin:0 0 4px">${ts.correctCount}/${attempted}</p>
      <p style="font-size:14px;color:var(--text-2);margin:0 0 18px">${pct}% chính xác</p>
      <div class="btnrow">
        <button class="ghost" id="t-back-home">Về Từ vựng</button>
        <button class="primary" id="t-retry-btn">Làm lại</button>
      </div>
    </div>
  `;
  document.getElementById('t-back-home').onclick = renderVocabHome;
  document.getElementById('t-retry-btn').onclick = ()=> startType(shuffle(ts.words), ts.mode, ts.label);
}

// ---- matching game ----
function startMatchGame(){
  const pool = shuffle(VOCAB).slice(0, 8);
  let cards = [];
  pool.forEach((v, i)=>{
    cards.push({key:i, type:'en', text:v.w, matched:false});
    cards.push({key:i, type:'vn', text:v.vnCore, matched:false});
  });
  cards = shuffle(cards);
  matchSession = { cards, flippedIdx:[], matchedCount:0, attempts:0, startTime:Date.now(), locked:false };
  renderMatchGame();
}

function renderMatchGame(){
  const ms = matchSession;
  app.innerHTML = `
    <div class="card">
      <div class="meta-row">
        <span>Game nối từ — ${ms.matchedCount}/8 cặp</span>
        <span>Lượt: ${ms.attempts}</span>
      </div>
      <div class="match-grid" id="match-grid"></div>
      <div class="btnrow" style="margin-top:14px">
        <button class="ghost" id="match-back">Về Từ vựng</button>
      </div>
    </div>
  `;
  const grid = document.getElementById('match-grid');
  ms.cards.forEach((c, idx)=>{
    const el = document.createElement('div');
    const shown = c.matched || ms.flippedIdx.includes(idx);
    el.className = 'match-card' + (c.matched?' matched':'') + (ms.flippedIdx.includes(idx)&&!c.matched?' flipped':'');
    el.textContent = shown ? c.text : '?';
    el.onclick = ()=> flipMatchCard(idx);
    grid.appendChild(el);
  });
  document.getElementById('match-back').onclick = renderVocabHome;
}

function flipMatchCard(idx){
  const ms = matchSession;
  if(ms.locked) return;
  const c = ms.cards[idx];
  if(c.matched || ms.flippedIdx.includes(idx)) return;
  ms.flippedIdx.push(idx);
  renderMatchGame();
  if(ms.flippedIdx.length === 2){
    ms.attempts++;
    ms.locked = true;
    const [i1, i2] = ms.flippedIdx;
    const c1 = ms.cards[i1], c2 = ms.cards[i2];
    if(c1.key === c2.key && c1.type !== c2.type){
      c1.matched = true; c2.matched = true;
      ms.matchedCount++;
      addXP(12);
      ms.flippedIdx = [];
      ms.locked = false;
      renderMatchGame();
      if(ms.matchedCount === 8){
        setTimeout(renderMatchSummary, 350);
      }
    } else {
      setTimeout(()=>{
        ms.flippedIdx = [];
        ms.locked = false;
        renderMatchGame();
      }, 700);
    }
  }
}

function renderMatchSummary(){
  const ms = matchSession;
  const seconds = Math.round((Date.now()-ms.startTime)/1000);
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <p style="font-size:14px;color:var(--text-2);margin:0 0 6px">Game nối từ — hoàn thành!</p>
      <p style="font-size:34px;font-weight:700;color:var(--accent-2);margin:0 0 4px">${ms.attempts} lượt</p>
      <p style="font-size:14px;color:var(--text-2);margin:0 0 18px">Thời gian: ${seconds} giây</p>
      <div class="btnrow">
        <button class="ghost" id="m-back">Về Từ vựng</button>
        <button class="primary" id="m-retry">Chơi lại</button>
      </div>
    </div>
  `;
  document.getElementById('m-back').onclick = renderVocabHome;
  document.getElementById('m-retry').onclick = startMatchGame;
}

// ==================== VIẾT (Controlled Writing + Task 1/2) ====================
let cwProgress = {}; // id -> {attempts, correct, lastCorrect}

function loadCWProgress(){
  try{ const raw = localStorage.getItem('vstep_cw_progress_v1'); if(raw) cwProgress = JSON.parse(raw); }catch(e){}
}
function saveCWProgress(){ try{ localStorage.setItem('vstep_cw_progress_v1', JSON.stringify(cwProgress)); }catch(e){} }

function recordCW(id, correct){
  const p = cwProgress[id] || {attempts:0, correct:0, lastCorrect:null};
  p.attempts++;
  if(correct) p.correct++;
  p.lastCorrect = correct;
  cwProgress[id] = p;
  saveCWProgress();
}

function byCWId(id){ return CW.find(c=>c.id===id); }

function renderWritingHome(){
  const cwDone = CW.filter(c=>cwProgress[c.id]).length;
  const cwCorrect = CW.filter(c=>cwProgress[c.id] && cwProgress[c.id].lastCorrect===true).length;
  app.innerHTML = `
    <div class="card">
      <b style="font-size:14px;display:block;margin-bottom:4px">1. Controlled Writing — ghép câu đúng ngữ pháp</b>
      <p style="font-size:12px;color:var(--text-2);margin:0 0 10px">25 câu, chọn câu đúng được ghép từ các từ gợi ý</p>
      <div class="chip-btn" id="cw-method" style="margin-bottom:10px"><b>📖 Xem phương pháp làm trước</b><small>6 bước kiểm tra khi chọn đáp án</small></div>
      <div class="chip-btn" id="cw-start"><b>Bắt đầu luyện (25 câu)</b><small>Đã làm ${cwDone}/25 · Đúng ${cwCorrect}</small></div>
    </div>
    <div class="card">
      <b style="font-size:14px;display:block;margin-bottom:4px">2. Luyện viết Task 1 — Thư/Email (~120 từ)</b>
      <p style="font-size:12px;color:var(--text-2);margin:0 0 10px">Viết thư/email theo tình huống, có cấu trúc mẫu và checklist tự chấm</p>
      <div class="grid">
        <div class="chip-btn" id="w1-guide"><b>Xem cấu trúc & mẫu câu</b><small>3 phần: Mở đầu - Nội dung - Kết thư</small></div>
        <div class="chip-btn" id="w1-practice"><b>Luyện viết ngay</b><small>Đề bài ngẫu nhiên + đếm từ + checklist</small></div>
      </div>
    </div>
    <div class="card">
      <b style="font-size:14px;display:block;margin-bottom:4px">3. Luyện viết Task 2 — Bài luận (~250 từ)</b>
      <p style="font-size:12px;color:var(--text-2);margin:0 0 10px">Viết bài luận nêu quan điểm theo chủ đề, có cấu trúc 4 đoạn chuẩn</p>
      <div class="grid">
        <div class="chip-btn" id="w2-guide"><b>Xem cấu trúc & mẫu câu</b><small>4 đoạn: Mở - Thân 1 - Thân 2 - Kết</small></div>
        <div class="chip-btn" id="w2-practice"><b>Luyện viết ngay</b><small>Đề bài ngẫu nhiên + đếm từ + checklist</small></div>
      </div>
    </div>
  `;
  document.getElementById('cw-method').onclick = renderCWMethod;
  document.getElementById('cw-start').onclick = ()=> startCW(shuffle(CW.map(c=>c.id)));
  document.getElementById('w1-guide').onclick = ()=> renderWritingGuide(1);
  document.getElementById('w2-guide').onclick = ()=> renderWritingGuide(2);
  document.getElementById('w1-practice').onclick = ()=> renderWritingPractice(1);
  document.getElementById('w2-practice').onclick = ()=> renderWritingPractice(2);
}

function renderCWMethod(){
  const stepsHtml = WGUIDE.method.map(s=>`<div class="method-step">${escapeHtml(s)}</div>`).join('');
  app.innerHTML = `
    <div class="card">
      <b style="font-size:15px;display:block;margin-bottom:12px">Phương pháp làm Controlled Writing</b>
      ${stepsHtml}
      <button class="primary" id="cw-method-start" style="margin-top:8px">Bắt đầu luyện ngay</button>
    </div>
  `;
  document.getElementById('cw-method-start').onclick = ()=> startCW(shuffle(CW.map(c=>c.id)));
}

// ---- Controlled Writing quiz engine ----
function startCW(ids){
  cwSession = { ids, idx:0, score:0, hearts:5 };
  renderCWQuestion();
}

function renderCWQuestion(){
  if(!cwSession) return;
  const item = byCWId(cwSession.ids[cwSession.idx]);
  const total = cwSession.ids.length;
  const pct = Math.round((cwSession.idx/total)*100);
  app.innerHTML = `
    <div class="card">
      <div class="meta-row">
        <span>Controlled Writing — Câu ${cwSession.idx+1}/${total}</span>
        <span>${heartsHtml(cwSession.hearts)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p style="font-size:12px;color:var(--text-2);margin:0 0 6px">Từ gợi ý:</p>
      <p class="qtext" style="font-style:italic">${escapeHtml(item.cue)}</p>
      <div id="opts"></div>
      <div id="explain-holder"></div>
      <div class="btnrow" id="btnrow" style="display:none">
        <button class="primary" id="cw-next-btn">Câu tiếp theo →</button>
      </div>
    </div>
  `;
  const optsEl = document.getElementById('opts');
  ['A','B','C','D'].forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<b>${letter}.</b> ${escapeHtml(item.opts[letter])}`;
    btn.onclick = ()=> selectCWAnswer(letter, item, btn);
    optsEl.appendChild(btn);
  });
  document.getElementById('cw-next-btn').onclick = nextCWQuestion;
}

function selectCWAnswer(letter, item, btnEl){
  if(btnEl.dataset.locked) return;
  const correct = letter === item.ans;
  [...document.getElementById('opts').children].forEach(b=>{
    b.dataset.locked = '1';
    b.disabled = true;
    const l = b.querySelector('b').textContent[0];
    if(l === item.ans) b.classList.add('correct');
    else if(l === letter && !correct) b.classList.add('wrong');
  });
  const holder = document.getElementById('explain-holder');
  holder.innerHTML = `<div class="explain ${correct?'ok':'bad'}">${correct? '✓ Đúng vì: ' : ('✗ Sai. Đáp án đúng là '+item.ans+'. ')}${escapeHtml(item.expl)}</div>`;
  document.getElementById('btnrow').style.display = 'flex';
  recordCW(item.id, correct);
  if(correct){ cwSession.score++; addXP(10); }
  else { cwSession.hearts--; }
  if(cwSession.hearts<=0){
    document.getElementById('cw-next-btn').textContent = 'Hết tim — Xem kết quả';
  }
}

function nextCWQuestion(){
  if(!cwSession) return;
  cwSession.idx++;
  if(cwSession.hearts<=0 || cwSession.idx >= cwSession.ids.length){
    renderCWSummary();
  } else {
    renderCWQuestion();
  }
}

function renderCWSummary(){
  const attempted = cwSession.idx;
  const pct = attempted ? Math.round((cwSession.score/attempted)*100) : 0;
  const heartsOut = cwSession.hearts<=0;
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <p style="font-size:14px;color:var(--text-2);margin:0 0 6px">Controlled Writing — ${heartsOut?'Hết tim! Dừng sớm':'hoàn thành'}</p>
      <p style="font-size:34px;font-weight:700;color:var(--accent-2);margin:0 0 4px">${cwSession.score}/${attempted}</p>
      <p style="font-size:14px;color:var(--text-2);margin:0 0 18px">${pct}% chính xác${heartsOut?` · đã làm ${attempted}/${cwSession.ids.length} câu`:''}</p>
      <div class="btnrow">
        <button class="ghost" id="cw-back-home">Về trang Viết</button>
        <button class="primary" id="cw-retry-btn">Làm lại</button>
      </div>
    </div>
  `;
  document.getElementById('cw-back-home').onclick = renderWritingHome;
  document.getElementById('cw-retry-btn').onclick = ()=> startCW(shuffle(cwSession.ids));
}

// ---- Writing guide (structure + phrases + checklist) ----
function renderWritingGuide(taskNum){
  const structure = taskNum===1 ? WGUIDE.task1Structure : WGUIDE.task2Structure;
  const rows = structure.map((s,i)=>`
    <div class="wstruct-row">
      <div class="wstruct-num">${i+1}</div>
      <div class="wstruct-body">

        <p>${escapeHtml(s[1])}</p>
        <p class="phrase">${escapeHtml(s[2])}</p>

  const phraseGroups = Object.entries(WGUIDE.linkingPhrases).map(([group, phrases])=>`

      <b style="font-size:14px;display:block;margin-bottom:10px">Checklist tự kiểm tra trước khi nộp</b>
      ${checklistHtml}
    </div>
    <div class="btnrow">
      <button class="primary" id="w-goto-practice">Luyện viết ngay</button>
    </div>
  `;
  document.getElementById('w-goto-practice').onclick = ()=> renderWritingPractice(taskNum);
}

// ---- Writing practice (draft + word count + self-checklist, saved locally) ----
function loadWritingDrafts(){
  try{ const raw = localStorage.getItem('vstep_writing_drafts_v1'); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function saveWritingDraft(key, data){
  const all = loadWritingDrafts();
  all[key] = data;
  try{ localStorage.setItem('vstep_writing_drafts_v1', JSON.stringify(all)); }catch(e){}
}

function renderWritingPractice(taskNum){
  const topics = taskNum===1 ? WGUIDE.task1Topics : WGUIDE.task2Topics;
  const topicIdx = Math.floor(Math.random()*topics.length);
  const topic = topics[topicIdx];
  const draftKey = 'task'+taskNum+'-'+topicIdx;
  const saved = loadWritingDrafts()[draftKey] || {text:'', checked:[]};
  const targetWords = taskNum===1 ? 120 : 250;

  app.innerHTML = `
    <div class="card">
      <div class="meta-row"><span>Luyện viết Task ${taskNum}</span><span>Mục tiêu ~${targetWords} từ</span></div>
      <div class="wtopic-box"><b>Đề bài:</b><br>${escapeHtml(topic)}</div>
      <textarea class="wtextarea" id="w-draft" placeholder="Viết bài của bạn vào đây...">${escapeHtml(saved.text)}</textarea>
      <div class="wcount" id="w-count"></div>
      <div class="wchecklist" id="w-checklist"></div>
      <div class="btnrow">
        <button class="ghost" id="w-new-topic">Đổi đề khác</button>
        <button class="primary" id="w-save">💾 Lưu bản nháp</button>
      </div>
    </div>
  `;

  const textarea = document.getElementById('w-draft');
  const countEl = document.getElementById('w-count');
  const checklistEl = document.getElementById('w-checklist');

  function updateCount(){
    const words = textarea.value.trim().split(/\s+/).filter(Boolean).length;
    const pctOfTarget = Math.round((words/targetWords)*100);
    let cls = 'warn';
    if(pctOfTarget>=90 && pctOfTarget<=130) cls='ok';
    countEl.className = 'wcount '+cls;
    countEl.innerHTML = `<span>${words} từ / mục tiêu ~${targetWords} từ</span><span>${pctOfTarget}%</span>`;
  }
  textarea.addEventListener('input', updateCount);
  updateCount();

  checklistEl.innerHTML = WGUIDE.checklist.map((c,i)=>`
    <label><input type="checkbox" data-i="${i}" ${saved.checked && saved.checked.includes(i) ? 'checked':''}> ${escapeHtml(c)}</label>
  `).join('');

  document.getElementById('w-new-topic').onclick = ()=> renderWritingPractice(taskNum);
  document.getElementById('w-save').onclick = ()=>{
    const checked = [...checklistEl.querySelectorAll('input:checked')].map(i=>parseInt(i.dataset.i));
    saveWritingDraft(draftKey, {text: textarea.value, checked, topic, savedAt: Date.now()});
    addXP(15);
    const btn = document.getElementById('w-save');
    btn.textContent = '✓ Đã lưu';
    setTimeout(()=>{ btn.textContent = '💾 Lưu bản nháp'; }, 1500);
  };
}
