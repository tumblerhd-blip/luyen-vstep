<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi VSTEP — Business English</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5496">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luyện VSTEP">

<style>
:root{
  --bg:#f7f8fb; --card:#ffffff; --text:#1a1d29; --text-2:#5b6072;
  --accent:#2f5496; --accent-2:#1f3864; --border:#e2e5ec;
  --green-bg:#dcf5e3; --green-tx:#146c2e; --red-bg:#fde2e2; --red-tx:#a3231f;
  --yellow-bg:#fff3cd; --chip:#eef1f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161f; --card:#1d2030; --text:#eef0f6; --text-2:#a0a5b8;
    --accent:#6f95d6; --accent-2:#a9c1ee; --border:#2c3045;
    --green-bg:#123a22; --green-tx:#7ee2a0; --red-bg:#3a1616; --red-tx:#ff9b96;
    --yellow-bg:#3a3116; --chip:#252940;
  }
}
:root[data-theme="dark"]{
  --bg:#14161f; --card:#1d2030; --text:#eef0f6; --text-2:#a0a5b8;
  --accent:#6f95d6; --accent-2:#a9c1ee; --border:#2c3045;
  --green-bg:#123a22; --green-tx:#7ee2a0; --red-bg:#3a1616; --red-tx:#ff9b96;
  --yellow-bg:#3a3116; --chip:#252940;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{padding:18px 4px 10px}
h1{font-size:19px;margin:0 0 4px;color:var(--accent-2)}
.sub{font-size:13px;color:var(--text-2);margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:8px}
.tab{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip-btn{
  background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:12px 10px;
  cursor:pointer;text-align:left;color:var(--text);font-size:13px;line-height:1.4;
}
.chip-btn b{display:block;font-size:13px;color:var(--accent-2);margin-bottom:2px}
.chip-btn small{color:var(--text-2)}
.chip-btn:active{opacity:.8}
.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2);margin-bottom:10px}
.progress-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:16px;line-height:1.55;margin:0 0 16px;font-weight:500}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
  border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);
  font-size:14.5px;cursor:pointer;line-height:1.4;
}
.opt b{color:var(--accent);margin-right:8px}
.opt.correct{background:var(--green-bg);border-color:var(--green-tx);color:var(--green-tx)}
.opt.wrong{background:var(--red-bg);border-color:var(--red-tx);color:var(--red-tx)}
.opt:disabled{cursor:default}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.55;
  background:var(--chip);border-left:4px solid var(--accent);white-space:pre-wrap;
}
.explain.ok{border-left-color:var(--green-tx)}
.explain.bad{border-left-color:var(--red-tx)}
.btnrow{display:flex;gap:10px;margin-top:16px}
button.primary{
  background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;
  font-size:14px;cursor:pointer;flex:1;
}
button.ghost{
  background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;
  padding:11px 18px;font-size:14px;cursor:pointer;
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--chip);border-radius:10px;padding:12px;text-align:center}
.stat .num{font-size:20px;font-weight:700;color:var(--accent-2)}
.stat .lbl{font-size:11px;color:var(--text-2);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-2);font-weight:500;font-size:11.5px}
.pct{font-weight:600;padding:2px 8px;border-radius:6px;display:inline-block}
.pct.low{background:var(--red-bg);color:var(--red-tx)}
.pct.high{background:var(--green-bg);color:var(--green-tx)}
.pct.mid{background:var(--yellow-bg);color:var(--text)}
.empty{text-align:center;color:var(--text-2);font-size:13px;padding:30px 10px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent-2)}
.sync-badge{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#9aa0b4}
.dot.on{background:var(--green-tx)}
.flash{
  background:var(--chip);border:1.5px solid var(--border);border-radius:16px;
  padding:36px 22px;text-align:center;min-height:150px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;margin-bottom:14px;
}
.flash .front{font-size:22px;font-weight:700;color:var(--accent-2);word-break:break-word}
.flash .sub{font-size:12px;color:var(--text-2);margin-top:8px}
.flash .back{font-size:16px;margin-top:14px;line-height:1.5}
.flash .ex{font-size:13px;color:var(--text-2);margin-top:10px;font-style:italic}
.flash .tap{font-size:12px;color:var(--text-2);margin-top:14px}
.know-row{display:flex;gap:10px;margin-top:6px}
.know-btn{
  flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);font-size:14px;cursor:pointer;color:var(--text);
}
.know-btn.no{border-color:var(--red-tx);color:var(--red-tx)}
.know-btn.yes{border-color:var(--green-tx);color:var(--green-tx)}
.type-prompt{font-size:18px;font-weight:600;color:var(--accent-2);margin-bottom:6px;line-height:1.5}
.type-sub{font-size:12.5px;color:var(--text-2);margin-bottom:16px}
.type-input{
  width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font-size:15px;margin-bottom:12px;
}
.type-input.ok{border-color:var(--green-tx);background:var(--green-bg)}
.type-input.bad{border-color:var(--red-tx);background:var(--red-bg)}
.type-feedback{font-size:13.5px;line-height:1.55;padding:12px 14px;border-radius:10px;background:var(--chip);margin-bottom:12px;border-left:4px solid var(--accent)}
.type-feedback.ok{border-left-color:var(--green-tx)}
.type-feedback.bad{border-left-color:var(--red-tx)}
.blank-sentence{font-size:16px;line-height:1.6;margin-bottom:16px}
.blank-mark{border-bottom:2px solid var(--accent);padding:0 4px;font-weight:600;color:var(--accent)}
.tier-label{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.tier-label:first-child{margin-top:0}
.chip-btn .lockrow{display:flex;align-items:center;gap:6px}
.statsbar{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;margin-bottom:10px;font-size:12.5px;
}
.statsbar .lvl{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--accent-2);white-space:nowrap}
.statsbar .streak{display:flex;align-items:center;gap:4px;color:#e08b1f;font-weight:600;white-space:nowrap}
.xpbar{flex:1;height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.xpbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7fa6e0);transition:width .3s}
.hearts{font-size:14px;letter-spacing:1px}
.chip-btn.locked{opacity:.45;cursor:not-allowed;background:var(--border)}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.method-step{
  background:var(--chip);border-radius:10px;padding:12px 14px;margin-bottom:8px;
  font-size:13px;line-height:1.55;border-left:3px solid var(--accent);
}
.wtask-btn{
  display:block;width:100%;text-align:left;padding:14px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--card);color:var(--text);
  cursor:pointer;margin-bottom:8px;font-size:14px;font-weight:600;
}
.wtask-btn small{display:block;font-weight:400;color:var(--text-2);font-size:12px;margin-top:3px}
.wstruct-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.wstruct-row:last-child{border-bottom:none}
.wstruct-num{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.wstruct-body b{display:block;font-size:13.5px;color:var(--accent-2);margin-bottom:3px}
.wstruct-body p{font-size:12.5px;color:var(--text-2);margin:0 0 4px;line-height:1.5}
.wstruct-body .phrase{font-size:12px;font-style:italic;color:var(--text)}
.phrase-group{margin-bottom:10px}
.phrase-group b{font-size:12.5px;color:var(--accent-2);display:block;margin-bottom:4px}
.phrase-tag{
  display:inline-block;background:var(--chip);border-radius:6px;padding:3px 8px;
  font-size:12px;margin:2px 3px 2px 0;
}
.wtopic-box{background:var(--chip);border-radius:10px;padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
.wtextarea{
  width:100%;min-height:220px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);padding:12px;font-size:14px;line-height:1.5;
  font-family:inherit;resize:vertical;
}
.wcount{font-size:12px;color:var(--text-2);margin:6px 0 14px;display:flex;justify-content:space-between}
.wcount.warn{color:#c9852b}
.wcount.ok{color:var(--green-tx)}
.wchecklist label{
  display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;
  padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.wchecklist label:last-child{border-bottom:none}
.wchecklist input{margin-top:3px}
.match-card{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;border-radius:10px;font-size:11px;font-weight:600;
  padding:4px;text-align:center;cursor:pointer;line-height:1.25;word-break:break-word;
}
.match-card.flipped{background:var(--chip);color:var(--text);border:1.5px solid var(--accent)}
.match-card.matched{background:var(--green-bg);color:var(--green-tx);border:1.5px solid var(--green-tx);cursor:default}
</style>
</head>

 ______ not only to promote sales but also to upgrade a company's image.", "opts": {"A": "helps", "B": "helped", "C": "is helping", "D": "help"}, "ans": "A", "expl": "'Advertising' là danh từ không đếm được → chia số ít. Câu nêu chức năng chung, luôn đúng → Hiện tại đơn → helps."}, {"stt": 6, "code": "P1.6", "de": 1, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "The new advertising campaign is designed to appeal ______ younger consumers.", "opts": {"A": "to", "B": "for", "C": "at", "D": "of"}, "ans": "A", "expl": "Cụm cố định: appeal TO somebody = thu hút ai đó. Phải học thuộc, không suy luận."}, {"stt": 7, "code": "P1.7", "de": 1, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "Our customer service team is skilled ______ resolving complex issues efficiently.", "opts": {"A": "at", "B": "of", "C": "in", "D": "on"}, "ans": "A", "expl": "Cụm cố định: skilled AT + V-ing = giỏi trong việc gì. (Thực tế 'skilled in' cũng dùng được, nhưng với V-ing thì 'at' chuẩn hơn.)"}, {"stt": 8, "code": "P1.8", "de": 1, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "Expansion into the cell phone market would require a ______ trained workforce as well as massive capital investment.", "opts": {"A": "high", "B": "highness", "C": "highly", "D": "higher"}, "ans": "C", "expl": "Chỗ trống đứng TRƯỚC 'trained' (phân từ đóng vai tính từ) → cần TRẠNG TỪ bổ nghĩa → highly. Không dịch nghĩa, chỉ nhìn vị trí."}, {"stt": 9, "code": "P1.9", "de": 1, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "The ______ campaign for our new product will include social media advertising and special discounts.", "opts": {"A": "promote", "B": "promoting", "C": "promotion", "D": "promotional"}, "ans": "D", "expl": "Chỗ trống nằm GIỮA mạo từ 'The' và danh từ 'campaign' → cần TÍNH TỪ → promotional. Bẫy: nhiều người chọn 'promotion' (danh từ)."}, {"stt": 10, "code": "P1.10", "de": 1, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "At the beginning of this month, I signed a ______ with your company for an office renovation project.", "opts": {"A": "contract", "B": "newsletter", "C": "letter", "D": "memo"}, "ans": "A", "expl": "Ký kết cho một dự án giữa hai bên → contract (hợp đồng). Newsletter = bản tin, memo = bản ghi nhớ nội bộ."}, {"stt": 11, "code": "P1.11", "de": 1, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The candidates who have been ______ for the position of Managing Director will be contacted this week.", "opts": {"A": "short-changed", "B": "short-sighted", "C": "short-handed", "D": "short-listed"}, "ans": "D", "expl": "short-listed = được đưa vào danh sách rút gọn. (short-changed = bị trả thiếu tiền; short-sighted = thiển cận; short-handed = thiếu nhân lực.)"}, {"stt": 12, "code": "P1.12", "de": 1, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The budget for the new marketing campaign is ______ at $500,000, which includes both digital and traditional expenses.", "opts": {"A": "imagined", "B": "guessed", "C": "estimated", "D": "judged"}, "ans": "C", "expl": "Cụm chuẩn trong kinh doanh: be estimated AT + số tiền = được ước tính ở mức."}, {"stt": 13, "code": "P1.13", "de": 1, "phan": "SC", "dang": "G", "dangTen": "Cụm động từ (Phrasal Verbs)", "q": "Our company is planning to ______ the smaller competitor to expand our market share.", "opts": {"A": "take over", "B": "take off", "C": "take on", "D": "take after"}, "ans": "A", "expl": "take over = thâu tóm, tiếp quản (một công ty khác). take off = bùng nổ; take on = nhận thêm việc/người; take after = giống (người thân)."}, {"stt": 14, "code": "P1.14", "de": 1, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "Before Annie ran out for a meeting yesterday, she had Ms. Brunelli ______ the new clerk around the premises.", "opts": {"A": "show", "B": "showed", "C": "showing", "D": "was showed"}, "ans": "A", "expl": "Cấu trúc SAI KHIẾN CHỦ ĐỘNG: have + NGƯỜI + V NGUYÊN THỂ. Ms. Brunelli tự thực hiện hành động → show."}, {"stt": 15, "code": "P1.15", "de": 1, "phan": "SC", "dang": "I", "dangTen": "Mạo từ & Từ hạn định (Articles / Determiners)", "q": "______ merchandise has been packaged and is now ready to be transported from the warehouse to the retail outlets.", "opts": {"A": "A", "B": "Some", "C": "Each", "D": "These"}, "ans": "B", "expl": "'merchandise' là danh từ KHÔNG ĐẾM ĐƯỢC (xác nhận bởi 'has been' số ít) → không dùng A/Each/These → Some."}, {"stt": 16, "code": "P1.16", "de": 1, "phan": "ED", "dang": "F2", "dangTen": "Despite / In spite of / Although + sai loại", "q": "______ the cost was high, we decided to carry out the project.", "opts": {"A": "In spite of", "B": "was", "C": "to carry out", "D": "the"}, "ans": "A", "expl": "In spite of + DANH TỪ/V-ing, không bao giờ + mệnh đề (S+V). Ở đây theo sau là 'the cost was high' (mệnh đề) → phải đổi thành 'Although'. (Sửa thành: Although / In spite of the high cost)"}, {"stt": 17, "code": "P1.17", "de": 1, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "If you're not well, you had better ______ Ann to go to the conference instead.", "opts": {"A": "well", "B": "to ask", "C": "to go", "D": "instead"}, "ans": "B", "expl": "had better + V NGUYÊN THỂ (không có 'to'). → had better ask. (Sửa thành: ask)"}, {"stt": 18, "code": "P1.18", "de": 1, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "Without operating funds, a firm cannot continue to ______ business.", "opts": {"A": "Without", "B": "a", "C": "continue", "D": "make"}, "ans": "D", "expl": "Cụm cố định: DO business (không phải 'make business'). Ghi nhớ: do business with someone. (Sửa thành: do business)"}, {"stt": 19, "code": "P1.19", "de": 1, "phan": "ED", "dang": "F3", "dangTen": "Dùng sai từ loại (động từ thay cho danh từ)", "q": "At our company, raises and promotions are based on performance, not on ______.", "opts": {"A": "raises", "B": "promotions", "C": "based", "D": "senior"}, "ans": "D", "expl": "Sau giới từ 'on' cần DANH TỪ, song song với 'performance' (danh từ). 'senior' là tính từ → phải đổi thành 'seniority' (thâm niên). (Sửa thành: seniority)"}, {"stt": 20, "code": "P1.20", "de": 1, "phan": "ED", "dang": "F1", "dangTen": "Danh từ không đếm được bị thêm 's'", "q": "The assembly-line workers will be more productive when the company installs the new ______.", "opts": {"A": "assembly-line", "B": "productive", "C": "installs", "D": "equipments"}, "ans": "D", "expl": "'equipment' là danh từ KHÔNG ĐẾM ĐƯỢC → không bao giờ thêm 's'. (Sửa thành: equipment)"}, {"stt": 21, "code": "P2.1", "de": 2, "phan": "SC", "dang": "J", "dangTen": "Đại từ quan hệ & Mệnh đề danh ngữ", "q": "The firm, ______ organized business travel and holidays for top executives, was one of the biggest travel firms in the UK.", "opts": {"A": "whom", "B": "where", "C": "that", "D": "which"}, "ans": "D", "expl": "Có DẤU PHẨY → mệnh đề quan hệ KHÔNG xác định → bắt buộc dùng WHICH (không bao giờ dùng 'that' sau dấu phẩy). 'whom' chỉ dùng cho người."}, {"stt": 22, "code": "P2.2", "de": 2, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "Fast-Track advertises vacancies only inside the company ______ it believes in offering career opportunities to its staff.", "opts": {"A": "although", "B": "as", "C": "when", "D": "so that"}, "ans": "B", "expl": "Vế sau nêu LÝ DO (vì công ty tin vào việc trao cơ hội nội bộ) → 'as' = because. Không phải 'so that' vì đây là lý do, không phải mục đích."}, {"stt": 23, "code": "P2.3", "de": 2, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "Starting next month, salaries ______ paid through a newly installed electronic-paying system.", "opts": {"A": "are", "B": "were", "C": "is", "D": "will be"}, "ans": "D", "expl": "'Starting next month' → sự việc bắt đầu ở tương lai → will be (bị động tương lai)."}, {"stt": 24, "code": "P2.4", "de": 2, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "A number of small companies will go bankrupt when the government ______ the legal working hours to thirty-four hours a week.", "opts": {"A": "reduces", "B": "is reducing", "C": "reduced", "D": "will reduce"}, "ans": "A", "expl": "QUY TẮC QUAN TRỌNG: mệnh đề bắt đầu bằng WHEN nói về tương lai thì dùng HIỆN TẠI ĐƠN, không dùng will → reduces."}, {"stt": 25, "code": "P2.5", "de": 2, "phan": "SC", "dang": "C", "dangTen": "Câu điều kiện (Conditionals)", "q": "If personal income taxes had been lowered, the national economy ______ much more quickly.", "opts": {"A": "recovered", "B": "has recovered", "C": "has been recovered", "D": "would have recovered"}, "ans": "D", "expl": "Vế IF có 'had been lowered' (had + V3) → Điều kiện LOẠI 3 → vế chính dùng would have + V3 → would have recovered."}, {"stt": 26, "code": "P2.6", "de": 2, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "In 2004, Internet companies and small business web sites in Canada spent more than $2 billion ______ TV advertisement.", "opts": {"A": "in", "B": "on", "C": "at", "D": "to"}, "ans": "B", "expl": "Cụm cố định: spend money ON something = chi tiền vào việc gì."}, {"stt": 27, "code": "P2.7", "de": 2, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "The manager made it quite clear that she was very disappointed ______ the staff's performance.", "opts": {"A": "at", "B": "in", "C": "on", "D": "to"}, "ans": "A", "expl": "disappointed AT + sự việc/kết quả. (Trong thực tế 'disappointed with/in' cũng phổ biến, nhưng với kết quả cụ thể thì 'at' là đáp án chuẩn của đề.)"}, {"stt": 28, "code": "P2.8", "de": 2, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "The proposed budget increases would make it possible to give added ______ to each sector of the firm.", "opts": {"A": "supported", "B": "supporting", "C": "support", "D": "supportive"}, "ans": "C", "expl": "Chỗ trống đứng SAU tính từ 'added' → cần DANH TỪ làm tân ngữ cho 'give' → support."}, {"stt": 29, "code": "P2.9", "de": 2, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "After ______ reading all the resumes, the board will decide which applicants should be invited.", "opts": {"A": "carefully", "B": "caring", "C": "carefulness", "D": "care"}, "ans": "A", "expl": "Chỗ trống đứng TRƯỚC V-ing 'reading' → cần TRẠNG TỪ bổ nghĩa cho hành động → carefully."}, {"stt": 30, "code": "P2.10", "de": 2, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "Advances in technology have made mobile phones smaller and affordable to the ______ market.", "opts": {"A": "buyer's", "B": "export", "C": "niche", "D": "mass"}, "ans": "D", "expl": "mass market = thị trường đại chúng (phù hợp với 'affordable' = giá phải chăng, nhiều người mua được). Niche market ngược lại = thị trường ngách."}, {"stt": 31, "code": "P2.11", "de": 2, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The bank demanded ______ in the amount of $50,000 from GorTech Computers for costs incurred from the failed system.", "opts": {"A": "revenue", "B": "income", "C": "compensation", "D": "loss"}, "ans": "C", "expl": "Đòi tiền vì thiệt hại gây ra → compensation (khoản bồi thường)."}, {"stt": 32, "code": "P2.12", "de": 2, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "For a limited time only, all of our customers can take ______ of our free online contents.", "opts": {"A": "service", "B": "advantage", "C": "improvement", "D": "responsibility"}, "ans": "B", "expl": "Cụm cố định: take advantage OF = tận dụng."}, {"stt": 33, "code": "P2.13", "de": 2, "phan": "SC", "dang": "G", "dangTen": "Cụm động từ (Phrasal Verbs)", "q": "The government wants to ______ a new scheme to encourage people to start their own businesses.", "opts": {"A": "hand out", "B": "run out", "C": "look out", "D": "work out"}, "ans": "D", "expl": "work out a scheme = vạch ra, xây dựng một kế hoạch. hand out = phát ra; run out = cạn kiệt; look out = coi chừng."}, {"stt": 34, "code": "P2.14", "de": 2, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "The firm gets its product ______ safely and in a timely manner; otherwise, it will seek an alternative shipper.", "opts": {"A": "package", "B": "to package", "C": "packaged", "D": "packaging"}, "ans": "C", "expl": "Cấu trúc SAI KHIẾN BỊ ĐỘNG: get + VẬT + V3. Sản phẩm BỊ đóng gói (không tự đóng gói) → packaged."}, {"stt": 35, "code": "P2.15", "de": 2, "phan": "SC", "dang": "I", "dangTen": "Mạo từ & Từ hạn định (Articles / Determiners)", "q": "They are developing ______ one-hour program that may interest older viewers.", "opts": {"A": "many", "B": "an", "C": "a", "D": "any"}, "ans": "C", "expl": "Chọn a/an theo ÂM ĐẦU, không theo chữ cái. 'one' đọc là /wʌn/ - bắt đầu bằng phụ âm /w/ → dùng 'a', không dùng 'an'."}, {"stt": 36, "code": "P2.16", "de": 2, "phan": "ED", "dang": "F7", "dangTen": "Đại từ, mạo từ, thì", "q": "Small businesses often confine ______ operations to a single neighborhood.", "opts": {"A": "Small", "B": "theirs", "C": "to", "D": "neighborhood"}, "ans": "B", "expl": "Trước danh từ ('operations') dùng TÍNH TỪ SỞ HỮU 'their'. 'theirs' là đại từ sở hữu, đứng một mình, không có danh từ theo sau. (Sửa thành: their)"}, {"stt": 37, "code": "P2.17", "de": 2, "phan": "ED", "dang": "F2", "dangTen": "Despite / In spite of / Although + sai loại", "q": "______ offering them a 20% discount, we didn't get the order.", "opts": {"A": "Despite of", "B": "a", "C": "discount", "D": "the order"}, "ans": "A", "expl": "KHÔNG BAO GIỜ có 'Despite of'. Chỉ có: Despite + N/V-ing HOẶC In spite of + N/V-ing. (Sửa thành: Despite)"}, {"stt": 38, "code": "P2.18", "de": 2, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "Computers used ______ much bigger than they are today.", "opts": {"A": "to being", "B": "much", "C": "than", "D": "are"}, "ans": "A", "expl": "used to + V NGUYÊN THỂ (diễn tả thói quen/trạng thái trong quá khứ). Phân biệt với 'be used to + V-ing' (quen với việc gì). (Sửa thành: used to be)"}, {"stt": 39, "code": "P2.19", "de": 2, "phan": "ED", "dang": "F1", "dangTen": "Danh từ không đếm được bị thêm 's'", "q": "Do you have any previous ______ of this type of work?", "opts": {"A": "Do", "B": "any", "C": "experiences", "D": "of"}, "ans": "C", "expl": "'experience' mang nghĩa KINH NGHIỆM là danh từ không đếm được → không thêm 's'. (Chỉ đếm được khi nghĩa là 'trải nghiệm cụ thể'.) (Sửa thành: experience)"}, {"stt": 40, "code": "P2.20", "de": 2, "phan": "ED", "dang": "F5", "dangTen": "Lỗi so sánh", "q": "Of the three advertising agencies, Dentsu Inc. has had the ______ sales.", "opts": {"A": "Of", "B": "advertising", "C": "has", "D": "higher"}, "ans": "D", "expl": "So sánh từ 3 đối tượng TRỞ LÊN → dùng SO SÁNH NHẤT (highest). 'higher' chỉ dùng khi so sánh 2 đối tượng. (Sửa thành: highest)"}, {"stt": 41, "code": "P3.1", "de": 3, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "Repairs for our products are free of charge ______ they are done by our local dealerships.", "opts": {"A": "although", "B": "until", "C": "while", "D": "if"}, "ans": "D", "expl": "Miễn phí VỚI ĐIỀU KIỆN sửa tại đại lý địa phương → điều kiện → if."}, {"stt": 42, "code": "P3.2", "de": 3, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "You may choose any item from this catalogue. ______, you cannot choose more than two.", "opts": {"A": "However", "B": "Besides", "C": "Therefore", "D": "Otherwise"}, "ans": "A", "expl": "Vế đầu cho quyền tự do chọn, vế sau đặt giới hạn → ĐỐI LẬP → However."}, {"stt": 43, "code": "P3.3", "de": 3, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "Mrs. Brown was driving to work when the accident happened and ______ her car.", "opts": {"A": "has damaged", "B": "was damaging", "C": "damaged", "D": "will damage"}, "ans": "C", "expl": "Song song với 'happened' (quá khứ đơn) → dùng cùng thì → damaged."}, {"stt": 44, "code": "P3.4", "de": 3, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "Their new \"own brand\" instant coffee tastes very good, so it's not surprising that it ______ more and more popular now.", "opts": {"A": "will become", "B": "is becoming", "C": "becomes", "D": "became"}, "ans": "B", "expl": "'more and more... now' = tình trạng đang thay đổi ngay lúc này → Hiện tại tiếp diễn → is becoming."}, {"stt": 45, "code": "P3.5", "de": 3, "phan": "SC", "dang": "C", "dangTen": "Câu điều kiện (Conditionals)", "q": "We would face severe financial problems if we ______ able to renew this contract.", "opts": {"A": "aren't", "B": "haven't been", "C": "hadn't been", "D": "weren't"}, "ans": "D", "expl": "Vế chính có 'would face' (không có have) → Điều kiện LOẠI 2 → vế IF dùng quá khứ đơn, với to-be dùng 'were' cho mọi ngôi → weren't."}, {"stt": 46, "code": "P3.6", "de": 3, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "It is reported that 70% of employers have admitted ______ rejecting a candidate because of their bad online behaviour.", "opts": {"A": "to", "B": "for", "C": "on", "D": "at"}, "ans": "A", "expl": "Cụm cố định: admit TO + V-ing = thừa nhận đã làm gì."}, {"stt": 47, "code": "P3.7", "de": 3, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "Our team has been successful ______ securing new contracts, significantly boosting our annual revenue.", "opts": {"A": "on", "B": "of", "C": "to", "D": "in"}, "ans": "D", "expl": "Cụm cố định: successful IN + V-ing = thành công trong việc gì."}, {"stt": 48, "code": "P3.8", "de": 3, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "The nuclear power plant will not become ______ until all the safety equipment has been thoroughly tested.", "opts": {"A": "operate", "B": "operation", "C": "operative", "D": "operatively"}, "ans": "C", "expl": "Sau động từ liên kết 'become' phải là TÍNH TỪ → operative."}, {"stt": 49, "code": "P3.9", "de": 3, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "You create a story about your CV that sounds ______ but doesn't pass close examination.", "opts": {"A": "believing", "B": "believable", "C": "believably", "D": "belief"}, "ans": "B", "expl": "Sau động từ liên kết 'sounds' phải là TÍNH TỪ → believable."}, {"stt": 50, "code": "P3.10", "de": 3, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "These online sales and special ______ on books and CDs are offered only for a limited time.", "opts": {"A": "deliveries", "B": "packages", "C": "discounts", "D": "returns"}, "ans": "C", "expl": "Đi cùng 'online sales' và 'for a limited time' → discounts (giảm giá)."}, {"stt": 51, "code": "P3.11", "de": 3, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The bank won't lend you the money without some ______ that you will pay it back.", "opts": {"A": "profit", "B": "charge", "C": "interest", "D": "guarantee"}, "ans": "D", "expl": "Ngân hàng cần sự bảo đảm sẽ được hoàn trả → guarantee."}, {"stt": 52, "code": "P3.12", "de": 3, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The ______ of the contract is three years, with an option to renew for an additional two years.", "opts": {"A": "law", "B": "detail", "C": "rule", "D": "term"}, "ans": "D", "expl": "term of the contract = thời hạn hợp đồng."}, {"stt": 53, "code": "P3.13", "de": 3, "phan": "SC", "dang": "G", "dangTen": "Cụm động từ (Phrasal Verbs)", "q": "The abbreviation ROI ______ Return on Investment, a key metric we use to evaluate profitability.", "opts": {"A": "stands for", "B": "stays over", "C": "keeps to", "D": "brings about"}, "ans": "A", "expl": "stand for = là viết tắt của, đại diện cho."}, {"stt": 54, "code": "P3.14", "de": 3, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "A wise consumer gets his or her phone order ______ in writing before submitting payment.", "opts": {"A": "confirming", "B": "to confirm", "C": "confirmed", "D": "confirm"}, "ans": "C", "expl": "get + VẬT (order) + V3 → order được xác nhận bởi bên khác → confirmed."}, {"stt": 55, "code": "P3.15", "de": 3, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "______ marketing is concerned, the best thing is to talk with the Sales Manager.", "opts": {"A": "As much", "B": "As far as", "C": "As for", "D": "As with"}, "ans": "B", "expl": "Cấu trúc cố định: As far as ... is concerned = xét về khía cạnh..., liên quan đến..."}, {"stt": 56, "code": "P3.16", "de": 3, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "This method is not ______ for us to solve the problem.", "opts": {"A": "This", "B": "enough good", "C": "us", "D": "to solve"}, "ans": "B", "expl": "'enough' đứng SAU tính từ (good enough), nhưng đứng TRƯỚC danh từ (enough money). (Sửa thành: good enough)"}, {"stt": 57, "code": "P3.17", "de": 3, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "You had better ______ the main points at the end of your presentation.", "opts": {"A": "to repeat", "B": "at", "C": "of", "D": "presentation"}, "ans": "A", "expl": "had better + V NGUYÊN THỂ, không có 'to'. (Câu này lặp lại cùng bẫy với P1.17.) (Sửa thành: repeat)"}, {"stt": 58, "code": "P3.18", "de": 3, "phan": "ED", "dang": "F2", "dangTen": "Despite / In spite of / Although + sai loại", "q": "______ he had a good salary, he was unhappy in his job.", "opts": {"A": "In spite of", "B": "had", "C": "unhappy", "D": "his"}, "ans": "A", "expl": "In spite of + N/V-ing. Theo sau là mệnh đề 'he had a good salary' → phải dùng 'Although'. (Sửa thành: Although)"}, {"stt": 59, "code": "P3.19", "de": 3, "phan": "ED", "dang": "F7", "dangTen": "Đại từ, mạo từ, thì", "q": "If our plane ______ late, we will miss our meeting with Mr. Paul.", "opts": {"A": "our", "B": "arrived", "C": "will miss", "D": "with"}, "ans": "B", "expl": "Vế chính có 'will miss' → Điều kiện LOẠI 1 → vế IF phải dùng HIỆN TẠI ĐƠN → arrives. (Sửa thành: arrives)"}, {"stt": 60, "code": "P3.20", "de": 3, "phan": "ED", "dang": "F1", "dangTen": "Danh từ không đếm được bị thêm 's'", "q": "I asked if we could have just a little ______ to prepare for the meeting.", "opts": {"A": "asked", "B": "could have", "C": "more times", "D": "for the meeting"}, "ans": "C", "expl": "'time' với nghĩa THỜI GIAN là không đếm được → 'a little more time'. ('times' chỉ dùng khi nghĩa là 'số lần'.) (Sửa thành: more time)"}, {"stt": 61, "code": "P4.1", "de": 4, "phan": "SC", "dang": "J", "dangTen": "Đại từ quan hệ & Mệnh đề danh ngữ", "q": "In order to stay competitive in the global market, we should know ______ our customers need.", "opts": {"A": "which", "B": "when", "C": "that", "D": "what"}, "ans": "D", "expl": "Sau 'know' cần mệnh đề danh ngữ làm tân ngữ, và phía trước KHÔNG có danh từ nào để 'that/which' bổ nghĩa → dùng WHAT (= cái mà)."}, {"stt": 62, "code": "P4.2", "de": 4, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "The shipment of the new office furniture was delayed, ______ it arrived a week later than expected.", "opts": {"A": "so", "B": "but", "C": "or", "D": "nor"}, "ans": "A", "expl": "Bị trì hoãn (nguyên nhân) → đến muộn 1 tuần (kết quả) → quan hệ nhân quả → so."}, {"stt": 63, "code": "P4.3", "de": 4, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "When Ms. Samantha ______ Beijing for a workshop next week, she will stay at the Ramada Hotel.", "opts": {"A": "visits", "B": "visited", "C": "is visiting", "D": "was visiting"}, "ans": "A", "expl": "Bẫy kinh điển: thấy 'next week' vội chọn thì tương lai. Nhưng mệnh đề WHEN chỉ tương lai phải dùng HIỆN TẠI ĐƠN → visits."}, {"stt": 64, "code": "P4.4", "de": 4, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "I ______ the approval of three committee members before Bob signed off on the project.", "opts": {"A": "already get", "B": "had already gotten", "C": "have already gotten", "D": "was already getting"}, "ans": "B", "expl": "BẪY 'already': mốc so sánh ở đây là 'Bob signed off' (quá khứ), nên việc xảy ra trước phải dùng Quá khứ hoàn thành → had already gotten. KHÔNG phải have already gotten."}, {"stt": 65, "code": "P4.5", "de": 4, "phan": "SC", "dang": "C", "dangTen": "Câu điều kiện (Conditionals)", "q": "If insolvency laws do not change and continue to favor creditors, many small-scale companies ______ bankrupt.", "opts": {"A": "go", "B": "have gone", "C": "will go", "D": "went"}, "ans": "C", "expl": "Vế IF dùng hiện tại đơn ('do not change') → Điều kiện LOẠI 1 → vế chính dùng will + V → will go."}, {"stt": 66, "code": "P4.6", "de": 4, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "Our new software system is capable ______ handling large volumes of data.", "opts": {"A": "on", "B": "at", "C": "in", "D": "of"}, "ans": "D", "expl": "Cụm cố định: capable OF + V-ing = có khả năng làm gì."}, {"stt": 67, "code": "P4.7", "de": 4, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "We plan to launch our new marketing campaign ______ Christmas to maximize seasonal sales opportunities.", "opts": {"A": "at", "B": "on", "C": "in", "D": "to"}, "ans": "A", "expl": "Giới từ thời gian với dịp lễ: AT Christmas, AT Easter (nhưng ON Christmas Day nếu chỉ ngày cụ thể)."}, {"stt": 68, "code": "P4.8", "de": 4, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "It took the department almost a week to receive a ______ from the manufacturer.", "opts": {"A": "respond", "B": "response", "C": "responsive", "D": "responding"}, "ans": "B", "expl": "Chỗ trống đứng SAU mạo từ 'a' → cần DANH TỪ → response."}, {"stt": 69, "code": "P4.9", "de": 4, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "The team's ______ performance this quarter has significantly boosted our overall revenue.", "opts": {"A": "excellently", "B": "excellence", "C": "excellent", "D": "excel"}, "ans": "C", "expl": "Chỗ trống đứng TRƯỚC danh từ 'performance' → cần TÍNH TỪ → excellent."}, {"stt": 70, "code": "P4.10", "de": 4, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "The company is offering ______ of its new skincare product to allow customers to try it before buying.", "opts": {"A": "free samples", "B": "free consulting", "C": "interest-free credit", "D": "great after-sales service"}, "ans": "A", "expl": "Cho dùng thử trước khi mua → free samples (hàng mẫu miễn phí)."}, {"stt": 71, "code": "P4.11", "de": 4, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "Our biggest problem is that we spend too much. We need to ______ costs because we are having problems paying our bills.", "opts": {"A": "increase", "B": "bear", "C": "cover", "D": "cut"}, "ans": "D", "expl": "Chi tiêu quá nhiều, khó trả hóa đơn → phải CẮT GIẢM → cut costs."}, {"stt": 72, "code": "P4.12", "de": 4, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "He works as a furniture ______ who buys and sells tables and chairs in large quantities to the local shops.", "opts": {"A": "retailer", "B": "assistant", "C": "wholesaler", "D": "manager"}, "ans": "C", "expl": "Bán SỐ LƯỢNG LỚN cho các cửa hàng → wholesaler (nhà bán buôn). Retailer bán lẻ trực tiếp cho người tiêu dùng."}, {"stt": 73, "code": "P4.13", "de": 4, "phan": "SC", "dang": "G", "dangTen": "Cụm động từ (Phrasal Verbs)", "q": "The new marketing campaign really helped the product ______, increasing sales by over 50% within the first month.", "opts": {"A": "take off", "B": "give away", "C": "keep up", "D": "come about"}, "ans": "A", "expl": "take off = bùng nổ, tăng trưởng mạnh (doanh số). Khớp với 'increasing sales by over 50%'."}, {"stt": 74, "code": "P4.14", "de": 4, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "I received a text message from Takeshi yesterday, and it mentioned that they had the equipment ______ yesterday.", "opts": {"A": "shipped", "B": "ship", "C": "to ship", "D": "shipping"}, "ans": "A", "expl": "have + VẬT (equipment) + V3 → thiết bị ĐƯỢC vận chuyển → shipped."}, {"stt": 75, "code": "P4.15", "de": 4, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "Newcomers must ______ two basic computer sessions before they move on to an intermediate course.", "opts": {"A": "completing", "B": "complete", "C": "to complete", "D": "completes"}, "ans": "B", "expl": "Sau động từ khuyết thiếu MUST luôn là V NGUYÊN THỂ (không to, không -s, không -ing) → complete."}, {"stt": 76, "code": "P4.16", "de": 4, "phan": "ED", "dang": "F2", "dangTen": "Despite / In spite of / Although + sai loại", "q": "______ the tight deadline, the team managed to finish the report on time.", "opts": {"A": "Although", "B": "deadline", "C": "to finish", "D": "on time"}, "ans": "A", "expl": "Ngược lại với các câu trên: 'Although' phải đi với MỆNH ĐỀ, nhưng theo sau là cụm danh từ 'the tight deadline' → phải đổi thành 'Despite'. (Sửa thành: Despite / In spite of)"}, {"stt": 77, "code": "P4.17", "de": 4, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "The manager suggested ______ the meeting until next week.", "opts": {"A": "suggested", "B": "to postpone", "C": "until", "D": "next week"}, "ans": "B", "expl": "Động từ SUGGEST luôn đi với V-ing, không đi với to V → suggested postponing. (Sửa thành: postponing)"}, {"stt": 78, "code": "P4.18", "de": 4, "phan": "ED", "dang": "F3", "dangTen": "Dùng sai từ loại (động từ thay cho danh từ)", "q": "The company suffered a significant ______ due to poor financial planning.", "opts": {"A": "suffered", "B": "a", "C": "lose", "D": "planning"}, "ans": "C", "expl": "Sau 'a significant' (mạo từ + tính từ) cần DANH TỪ. 'lose' là động từ → phải đổi thành 'loss' (danh từ). (Sửa thành: loss)"}, {"stt": 79, "code": "P4.19", "de": 4, "phan": "ED", "dang": "F6", "dangTen": "Cấu trúc song song (Parallel structure)", "q": "Employees are expected to work efficiently, follow company policies, and ______ punctual.", "opts": {"A": "to work", "B": "follow", "C": "being", "D": "punctual"}, "ans": "C", "expl": "CẤU TRÚC SONG SONG: 3 hành động phải cùng dạng - to work, (to) follow, and (to) be. 'being' phá vỡ tính song song → phải đổi thành 'be'. (Sửa thành: be)"}, {"stt": 80, "code": "P4.20", "de": 4, "phan": "ED", "dang": "F1", "dangTen": "Danh từ không đếm được bị thêm 's'", "q": "We need more ______ before making a final decision.", "opts": {"A": "need", "B": "informations", "C": "before", "D": "decision"}, "ans": "B", "expl": "'information' là danh từ KHÔNG ĐẾM ĐƯỢC → không bao giờ thêm 's'. (Sửa thành: information)"}, {"stt": 81, "code": "P5.1", "de": 5, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "We need to cut costs; ______, we risk exceeding our budget for this fiscal quarter.", "opts": {"A": "however", "B": "otherwise", "C": "moreover", "D": "therefore"}, "ans": "B", "expl": "Nghĩa: 'nếu KHÔNG cắt giảm chi phí thì sẽ vượt ngân sách' → otherwise (nếu không thì)."}, {"stt": 82, "code": "P5.2", "de": 5, "phan": "SC", "dang": "A", "dangTen": "Liên từ & Từ nối (Conjunctions / Transitions)", "q": "I hope that I will finish the sales report on time, ______ I can't guarantee it.", "opts": {"A": "but", "B": "and", "C": "so", "D": "nor"}, "ans": "A", "expl": "Hy vọng xong đúng hạn >< nhưng không đảm bảo → đối lập → but."}, {"stt": 83, "code": "P5.3", "de": 5, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "How long have you worked for Lawton's? - Only for a few months. I ______ the company as a junior manager last December.", "opts": {"A": "had joined", "B": "joined", "C": "has joined", "D": "would join"}, "ans": "B", "expl": "'last December' = mốc quá khứ cụ thể, đã kết thúc → Quá khứ đơn → joined."}, {"stt": 84, "code": "P5.4", "de": 5, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "The demand for our product ______ significantly since the launch of our new marketing campaign.", "opts": {"A": "was increasing", "B": "has increased", "C": "increased", "D": "had increased"}, "ans": "B", "expl": "Từ khóa 'since' = từ mốc đó đến hiện tại → Hiện tại hoàn thành → has increased."}, {"stt": 85, "code": "P5.5", "de": 5, "phan": "SC", "dang": "C", "dangTen": "Câu điều kiện (Conditionals)", "q": "If I ______ this report, my secretary will send it to the proper department by the deadline.", "opts": {"A": "finish", "B": "finished", "C": "has finished", "D": "will finish"}, "ans": "A", "expl": "Vế chính có 'will send' → Điều kiện LOẠI 1 → vế IF dùng HIỆN TẠI ĐƠN, tuyệt đối không dùng will → finish."}, {"stt": 86, "code": "P5.6", "de": 5, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "They are here ______ holiday, but I am here ______ business.", "opts": {"A": "on ... on", "B": "at ... on", "C": "in ... on", "D": "on ... in"}, "ans": "A", "expl": "Cả hai đều dùng ON: on holiday (đi nghỉ) và on business (đi công tác)."}, {"stt": 87, "code": "P5.7", "de": 5, "phan": "SC", "dang": "D", "dangTen": "Giới từ & Cụm cố định (Prepositions / Collocations)", "q": "My brother thought he would sell his house, but ______ second thoughts he changed his mind.", "opts": {"A": "in", "B": "at", "C": "on", "D": "of"}, "ans": "C", "expl": "Cụm cố định: ON second thoughts = sau khi suy nghĩ lại."}, {"stt": 88, "code": "P5.8", "de": 5, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "Analysis of the commercial building sector in Canada has been ______ enhanced with the release of the Survey.", "opts": {"A": "greater", "B": "great", "C": "greatly", "D": "greatness"}, "ans": "C", "expl": "Chỗ trống đứng giữa 'has been' và phân từ 'enhanced' → cần TRẠNG TỪ → greatly."}, {"stt": 89, "code": "P5.9", "de": 5, "phan": "SC", "dang": "E", "dangTen": "Từ loại (Word Forms)", "q": "Last year's job fair in London was a remarkable ______, drawing over 200,000 participants worldwide.", "opts": {"A": "success", "B": "successful", "C": "succeed", "D": "successfully"}, "ans": "A", "expl": "Chỗ trống đứng SAU 'a remarkable' (mạo từ + tính từ) → cần DANH TỪ → success."}, {"stt": 90, "code": "P5.10", "de": 5, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "Our ______ policy allows you to pay some time after you buy but at no extra cost.", "opts": {"A": "interest-free-credit", "B": "money-back-guarantee", "C": "after-sales-service", "D": "loyalty-customer-scheme"}, "ans": "A", "expl": "Trả sau nhưng không mất thêm phí → interest-free credit (tín dụng không lãi suất)."}, {"stt": 91, "code": "P5.11", "de": 5, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "To succeed in business management, one should have good ______ skills, which means knowing how to deal well with other people.", "opts": {"A": "interpersonal", "B": "negotiation", "C": "time-management", "D": "problem-solving"}, "ans": "A", "expl": "Vế sau giải thích rõ: 'deal well with other people' → interpersonal skills (kỹ năng giao tiếp giữa người với người)."}, {"stt": 92, "code": "P5.12", "de": 5, "phan": "SC", "dang": "F", "dangTen": "Từ vựng thương mại (Business Vocabulary)", "q": "Mary is a very ______ person and she has come up with a lot of interesting ideas for the company's development.", "opts": {"A": "polite", "B": "organized", "C": "friendly", "D": "creative"}, "ans": "D", "expl": "Vế sau nói cô ấy nghĩ ra nhiều ý tưởng thú vị → creative (sáng tạo)."}, {"stt": 93, "code": "P5.13", "de": 5, "phan": "SC", "dang": "G", "dangTen": "Cụm động từ (Phrasal Verbs)", "q": "Employees can ______ tickets to the Christmas party at the front desk in the Personnel Department.", "opts": {"A": "join in", "B": "pick up", "C": "get over", "D": "make out"}, "ans": "B", "expl": "pick up = đến lấy, nhận (vé) tại một địa điểm."}, {"stt": 94, "code": "P5.14", "de": 5, "phan": "SC", "dang": "B", "dangTen": "Chia thì động từ (Verb Tenses)", "q": "John ______ to executive manager of an advertising company since last March.", "opts": {"A": "has been promoted", "B": "was promoted", "C": "has promoted", "D": "was promoting"}, "ans": "A", "expl": "'since last March' → Hiện tại hoàn thành. John ĐƯỢC thăng chức (bị động) → has been promoted."}, {"stt": 95, "code": "P5.15", "de": 5, "phan": "SC", "dang": "H", "dangTen": "Cấu trúc động từ đặc biệt (Verb Patterns)", "q": "While attending the seminar, we really enjoyed ______ with representatives from other branches.", "opts": {"A": "talk", "B": "talked", "C": "to talk", "D": "talking"}, "ans": "D", "expl": "Động từ ENJOY luôn đi với V-ing → talking. (Nhóm động từ + V-ing: enjoy, suggest, admit, avoid, finish, mind.)"}, {"stt": 96, "code": "P5.16", "de": 5, "phan": "ED", "dang": "F5", "dangTen": "Lỗi so sánh", "q": "This quarter's sales figures are ______ than those of last year.", "opts": {"A": "sales figures", "B": "more better", "C": "those", "D": "of"}, "ans": "B", "expl": "'better' đã là dạng so sánh hơn của 'good' rồi → KHÔNG được thêm 'more' vào trước (lỗi so sánh kép). (Sửa thành: better)"}, {"stt": 97, "code": "P5.17", "de": 5, "phan": "ED", "dang": "F7", "dangTen": "Đại từ, mạo từ, thì", "q": "She was appointed as the head of ______ finance department last month.", "opts": {"A": "appointed", "B": "as", "C": "a", "D": "department"}, "ans": "C", "expl": "'finance department' ở đây là phòng ban CỤ THỂ, xác định trong công ty → dùng mạo từ xác định 'the'. (Sửa thành: the)"}, {"stt": 98, "code": "P5.18", "de": 5, "phan": "ED", "dang": "F3", "dangTen": "Dùng sai từ loại (động từ thay cho danh từ)", "q": "There has been a steady ______ in customer satisfaction.", "opts": {"A": "There", "B": "steady", "C": "improve", "D": "satisfaction"}, "ans": "C", "expl": "Sau 'a steady' (mạo từ + tính từ) cần DANH TỪ. 'improve' là động từ → phải đổi thành 'improvement'. (Sửa thành: improvement)"}, {"stt": 99, "code": "P5.19", "de": 5, "phan": "ED", "dang": "F1", "dangTen": "Danh từ không đếm được bị thêm 's'", "q": "Before approving the plan, the manager asked for more ______ from the team.", "opts": {"A": "approving", "B": "asked", "C": "for", "D": "advices"}, "ans": "D", "expl": "'advice' là danh từ KHÔNG ĐẾM ĐƯỢC → không bao giờ thêm 's'. (Sửa thành: advice)"}, {"stt": 100, "code": "P5.20", "de": 5, "phan": "ED", "dang": "F4", "dangTen": "Sai cấu trúc cố định sau động từ", "q": "The report was so detailed that it took too long ______.", "opts": {"A": "so", "B": "detailed", "C": "took", "D": "completing"}, "ans": "D", "expl": "Cấu trúc: it takes + time + TO V (không dùng V-ing) → took too long to complete. (Sửa thành: to complete)"}]</script>
<script id="vocab-holder" type="application/json">[{"w": "therefore", "ipa": "/ˈðeərfɔːr/", "pos": "adverb", "vn": "vì vậy, do đó", "vnCore": "vì vậy", "ex": "The sales figures were low, therefore, we changed our strategy.", "blank": "The sales figures were low, therefore, we changed our strategy."}, {"w": "otherwise", "ipa": "/ˈʌðərwaɪz/", "pos": "adverb", "vn": "nếu không thì", "vnCore": "nếu không", "ex": "Please confirm today, otherwise we will cancel the booking.", "blank": "Please confirm today, otherwise we will cancel the booking."}, {"w": "upgrade", "ipa": "/ˈʌpɡreɪd/", "pos": "verb", "vn": "nâng cấp", "vnCore": "nâng cấp", "ex": "The company decided to upgrade its computer systems.", "blank": "The company decided to upgrade its computer systems."}, {"w": "infrastructure", "ipa": "/ˈɪnfrəstrʌktʃər/", "pos": "noun", "vn": "cơ sở hạ tầng", "vnCore": "cơ sở hạ tầng", "ex": "The city invested heavily in transport infrastructure.", "blank": "The city invested heavily in transport infrastructure."}, {"w": "efficiently", "ipa": "/ɪˈfɪʃntli/", "pos": "adverb", "vn": "một cách hiệu quả", "vnCore": "hiệu quả", "ex": "The new software helps employees work more efficiently.", "blank": "The new software helps employees work more efficiently."}, {"w": "consumer", "ipa": "/kənˈsjuːmər/", "pos": "noun", "vn": "người tiêu dùng", "vnCore": "người tiêu dùng", "ex": "Consumers are becoming more interested in eco-friendly products.", "blank": "Every business should listen carefully to what the consumer wants."}, {"w": "advertising", "ipa": "/ˈædvərtaɪzɪŋ/", "pos": "noun", "vn": "quảng cáo", "vnCore": "quảng cáo", "ex": "The company spends a lot on advertising every year.", "blank": "The company spends a lot on advertising every year."}, {"w": "promote", "ipa": "/prəˈmoʊt/", "pos": "verb", "vn": "quảng bá; thăng chức", "vnCore": "quảng bá", "ex": "They launched a campaign to promote the new product.", "blank": "They launched a campaign to promote the new product."}, {"w": "appeal to", "ipa": "/əˈpiːl tuː/", "pos": "phrasal verb", "vn": "thu hút, hấp dẫn", "vnCore": "thu hút", "ex": "This design is meant to appeal to younger customers.", "blank": "This design is meant to appeal to younger customers."}, {"w": "align", "ipa": "/əˈlaɪn/", "pos": "verb", "vn": "gắn kết, phù hợp với", "vnCore": "gắn kết", "ex": "Our new strategy aligns with the company's long-term goals.", "blank": "It is important that our marketing plan align with the company's overall strategy."}, {"w": "strategy", "ipa": "/ˈstrætədʒi/", "pos": "noun", "vn": "chiến lược", "vnCore": "chiến lược", "ex": "The board approved a new marketing strategy.", "blank": "The board approved a new marketing strategy."}, {"w": "skilled", "ipa": "/skɪld/", "pos": "adjective", "vn": "có kỹ năng, lành nghề", "vnCore": "có kỹ năng", "ex": "She is a highly skilled negotiator.", "blank": "She is a highly skilled negotiator."}, {"w": "resolve", "ipa": "/rɪˈzɒlv/", "pos": "verb", "vn": "giải quyết", "vnCore": "giải quyết", "ex": "The team worked hard to resolve the customer's complaint.", "blank": "The team worked hard to resolve the customer's complaint."}, {"w": "complex", "ipa": "/ˈkɒmpleks/", "pos": "adjective", "vn": "phức tạp", "vnCore": "phức tạp", "ex": "This is a complex issue that requires careful analysis.", "blank": "This is a complex issue that requires careful analysis."}, {"w": "satisfaction", "ipa": "/ˌsætɪsˈfækʃn/", "pos": "noun", "vn": "sự hài lòng", "vnCore": "hài lòng", "ex": "Customer satisfaction is our top priority.", "blank": "Customer satisfaction is our top priority."}, {"w": "expansion", "ipa": "/ɪkˈspænʃn/", "pos": "noun", "vn": "sự mở rộng", "vnCore": "mở rộng", "ex": "The company is planning an expansion into new markets.", "blank": "The company is planning an expansion into new markets."}, {"w": "workforce", "ipa": "/ˈwɜːrkfɔːrs/", "pos": "noun", "vn": "lực lượng lao động", "vnCore": "lực lượng lao động", "ex": "The factory has a workforce of over 500 people.", "blank": "The factory has a workforce of over 500 people."}, {"w": "investment", "ipa": "/ɪnˈvestmənt/", "pos": "noun", "vn": "sự đầu tư", "vnCore": "đầu tư", "ex": "This project requires a significant investment.", "blank": "This project requires a significant investment."}, {"w": "promotional", "ipa": "/prəˈmoʊʃənl/", "pos": "adjective", "vn": "(thuộc) khuyến mãi", "vnCore": "khuyến mãi", "ex": "We are running a promotional offer this month.", "blank": "We are running a promotional offer this month."}, {"w": "campaign", "ipa": "/kæmˈpeɪn/", "pos": "noun", "vn": "chiến dịch", "vnCore": "chiến dịch", "ex": "The marketing campaign was very successful.", "blank": "The marketing campaign was very successful."}, {"w": "contract", "ipa": "/ˈkɒntrækt/", "pos": "noun", "vn": "hợp đồng", "vnCore": "hợp đồng", "ex": "Both companies signed a three-year contract.", "blank": "Both companies signed a three-year contract."}, {"w": "renovation", "ipa": "/ˌrenəˈveɪʃn/", "pos": "noun", "vn": "sự cải tạo, tu sửa", "vnCore": "cải tạo", "ex": "The office renovation will take about two months.", "blank": "The office renovation will take about two months."}, {"w": "candidate", "ipa": "/ˈkændɪdət/", "pos": "noun", "vn": "ứng viên", "vnCore": "ứng viên", "ex": "We interviewed five candidates for the position.", "blank": "Every candidate must submit a resume before the interview."}, {"w": "short-listed", "ipa": "/ˈʃɔːrtlɪstɪd/", "pos": "adjective", "vn": "được đưa vào danh sách rút gọn", "vnCore": "vào danh sách rút gọn", "ex": "Three applicants have been short-listed for the final round.", "blank": "Three applicants have been short-listed for the final round."}, {"w": "budget", "ipa": "/ˈbʌdʒɪt/", "pos": "noun", "vn": "ngân sách", "vnCore": "ngân sách", "ex": "The marketing budget was increased this year.", "blank": "The marketing budget was increased this year."}, {"w": "estimate", "ipa": "/ˈestɪmeɪt/", "pos": "verb", "vn": "ước tính", "vnCore": "ước tính", "ex": "We estimate the project will cost about $10,000.", "blank": "We estimate the project will cost about $10,000."}, {"w": "competitor", "ipa": "/kəmˈpetɪtər/", "pos": "noun", "vn": "đối thủ cạnh tranh", "vnCore": "đối thủ cạnh tranh", "ex": "Our main competitor just launched a similar product.", "blank": "Our main competitor just launched a similar product."}, {"w": "take over", "ipa": "/teɪk ˈoʊvər/", "pos": "phrasal verb", "vn": "tiếp quản, thâu tóm", "vnCore": "tiếp quản", "ex": "The larger firm plans to take over its smaller rival.", "blank": "The larger firm plans to take over its smaller rival."}, {"w": "enhance", "ipa": "/ɪnˈhæns/", "pos": "verb", "vn": "nâng cao, cải thiện", "vnCore": "nâng cao", "ex": "The update will enhance the app's performance.", "blank": "The update will enhance the app's performance."}, {"w": "premises", "ipa": "/ˈpremɪsɪz/", "pos": "noun", "vn": "cơ sở, trụ sở", "vnCore": "trụ sở", "ex": "Visitors must sign in before entering the premises.", "blank": "Visitors must sign in before entering the premises."}, {"w": "merchandise", "ipa": "/ˈmɜːrtʃəndaɪz/", "pos": "noun", "vn": "hàng hóa", "vnCore": "hàng hóa", "ex": "The merchandise was shipped directly from the factory.", "blank": "The merchandise was shipped directly from the factory."}, {"w": "warehouse", "ipa": "/ˈweərhaʊs/", "pos": "noun", "vn": "nhà kho", "vnCore": "nhà kho", "ex": "The goods are stored in a large warehouse.", "blank": "The goods are stored in a large warehouse."}, {"w": "compensation", "ipa": "/ˌkɒmpenˈseɪʃn/", "pos": "noun", "vn": "sự bồi thường", "vnCore": "bồi thường", "ex": "The company paid compensation for the delayed shipment.", "blank": "The company paid compensation for the delayed shipment."}, {"w": "incur", "ipa": "/ɪnˈkɜːr/", "pos": "verb", "vn": "phải gánh chịu (chi phí)", "vnCore": "phải gánh chịu", "ex": "The delay caused the firm to incur extra costs.", "blank": "The delay caused the firm to incur extra costs."}, {"w": "advantage", "ipa": "/ədˈvɑːntɪdʒ/", "pos": "noun", "vn": "lợi thế", "vnCore": "lợi thế", "ex": "Customers can take advantage of the special discount.", "blank": "Customers can take advantage of the special discount."}, {"w": "scheme", "ipa": "/skiːm/", "pos": "noun", "vn": "kế hoạch, chương trình", "vnCore": "kế hoạch", "ex": "The government introduced a new tax scheme.", "blank": "The government introduced a new tax scheme."}, {"w": "encourage", "ipa": "/ɪnˈkʌrɪdʒ/", "pos": "verb", "vn": "khuyến khích", "vnCore": "khuyến khích", "ex": "The manager encouraged the team to share new ideas.", "blank": "Managers should encourage their team to share new ideas."}, {"w": "demand", "ipa": "/dɪˈmɑːnd/", "pos": "noun", "vn": "nhu cầu", "vnCore": "nhu cầu", "ex": "Demand for the product increased sharply.", "blank": "Demand for the product increased sharply."}, {"w": "revenue", "ipa": "/ˈrevənjuː/", "pos": "noun", "vn": "doanh thu", "vnCore": "doanh thu", "ex": "The company's revenue grew by 15% last year.", "blank": "The company's revenue grew by 15% last year."}, {"w": "interpersonal", "ipa": "/ˌɪntərˈpɜːrsənl/", "pos": "adjective", "vn": "(kỹ năng) giao tiếp giữa các cá nhân", "vnCore": "giao tiếp cá nhân", "ex": "Good interpersonal skills are essential in this job.", "blank": "Good interpersonal skills are essential in this job."}, {"w": "negotiation", "ipa": "/nɪˌɡoʊʃiˈeɪʃn/", "pos": "noun", "vn": "sự đàm phán", "vnCore": "đàm phán", "ex": "The negotiation lasted for several hours.", "blank": "The negotiation lasted for several hours."}, {"w": "organized", "ipa": "/ˈɔːrɡənaɪzd/", "pos": "adjective", "vn": "có tổ chức, ngăn nắp", "vnCore": "có tổ chức", "ex": "She is a very organized manager.", "blank": "She is a very organized manager."}, {"w": "creative", "ipa": "/kriˈeɪtɪv/", "pos": "adjective", "vn": "sáng tạo", "vnCore": "sáng tạo", "ex": "The team came up with a creative solution.", "blank": "The team came up with a creative solution."}, {"w": "stand for", "ipa": "/stænd fɔːr/", "pos": "phrasal verb", "vn": "viết tắt cho, đại diện cho", "vnCore": "viết tắt cho", "ex": "The letters CEO stand for Chief Executive Officer.", "blank": "The letters CEO stand for Chief Executive Officer."}, {"w": "wholesaler", "ipa": "/ˈhoʊlseɪlər/", "pos": "noun", "vn": "nhà bán buôn", "vnCore": "nhà bán buôn", "ex": "The wholesaler supplies goods to many small shops.", "blank": "The wholesaler supplies goods to many small shops."}, {"w": "retailer", "ipa": "/ˈriːteɪlər/", "pos": "noun", "vn": "nhà bán lẻ", "vnCore": "nhà bán lẻ", "ex": "The retailer sells directly to customers.", "blank": "The retailer sells directly to customers."}, {"w": "take off", "ipa": "/teɪk ɔːf/", "pos": "phrasal verb", "vn": "trở nên phổ biến/thành công nhanh chóng", "vnCore": "trở nên phổ biến nhanh", "ex": "Sales of the new phone really took off last month.", "blank": "We hope this new product will take off in the market."}, {"w": "give away", "ipa": "/ɡɪv əˈweɪ/", "pos": "phrasal verb", "vn": "tặng miễn phí", "vnCore": "tặng miễn phí", "ex": "The store is giving away free samples this week.", "blank": "The store plans to give away free samples this week."}, {"w": "keep up with", "ipa": "/kiːp ʌp wɪð/", "pos": "phrasal verb", "vn": "theo kịp", "vnCore": "theo kịp", "ex": "The factory struggled to keep up with rising demand.", "blank": "The factory struggled to keep up with rising demand."}, {"w": "shipment", "ipa": "/ˈʃɪpmənt/", "pos": "noun", "vn": "lô hàng", "vnCore": "lô hàng", "ex": "The shipment is expected to arrive next Monday.", "blank": "The shipment is expected to arrive next Monday."}, {"w": "workshop", "ipa": "/ˈwɜːrkʃɒp/", "pos": "noun", "vn": "buổi hội thảo, khóa tập huấn", "vnCore": "buổi hội thảo", "ex": "She attended a workshop on digital marketing.", "blank": "She attended a workshop on digital marketing."}]</script>
<script id="cw-holder" type="application/json">[{"id": "CW1.1", "cue": "Nokia / be / manufacturer / numerous different mobile solution.", "opts": {"A": "Nokia was the manufacturer of numerous different mobile solution.", "B": "Nokia is a manufacturer of numerous different mobile solutions.", "C": "Nokia is manufacturer of numerous different mobile solution.", "D": "Nokia was a manufacturer for numerous different mobile solutions."}, "ans": "B", "expl": "Sự thật hiện tại dùng thì hiện tại đơn (is). 'A manufacturer' vì có nhiều nhà sản xuất khác, không phải duy nhất. Danh từ đếm được số nhiều phải có 's': solutions."}, {"id": "CW1.2", "cue": "It / provide / equipment, solutions / services / network operators / corporations.", "opts": {"A": "It provides equipment, solutions and services to network operators and corporations.", "B": "It provided equipment, solutions and services for network operators and corporation.", "C": "It is providing equipment, solutions and services to network operators and corporations.", "D": "It provides equipment, solution and services for network operator and corporations."}, "ans": "A", "expl": "Sự thật/chức năng chung dùng hiện tại đơn. Cụm cố định: provide something TO somebody (không phải 'for'). Danh từ đếm được giữ nguyên số nhiều đã cho."}, {"id": "CW1.3", "cue": "/ the second quarter / 2009, / global market share / be / about 38%.", "opts": {"A": "In the second quarter of 2009, its global market share is about 38%.", "B": "In the second quarter of 2009, global market share was about 38%.", "C": "In the second quarter of 2009, its global market share was about 38%.", "D": "At the second quarter of 2009, its global market share was about 38 percent."}, "ans": "C", "expl": "Có mốc năm cụ thể trong quá khứ (2009) → dùng quá khứ đơn (was), không dùng hiện tại. Giới từ chỉ quý/năm dùng IN, không dùng AT. Cần đại từ sở hữu 'its' vì market share là của công ty đang nói tới."}, {"id": "CW1.4", "cue": "Nokia / play / very large role / the economy / Finland.", "opts": {"A": "Nokia plays a very large role in the economy of Finland.", "B": "Nokia played a very large role on the economy in Finland.", "C": "Nokia plays very large role in Finland's economy.", "D": "Nokia is playing a very large role of the economy of Finland."}, "ans": "A", "expl": "Sự thật chung dùng hiện tại đơn. Cụm cố định: play A role IN something. 'A very large role' cần mạo từ 'a' đứng trước."}, {"id": "CW1.5", "cue": "The key / Nokia's success / be / innovation / creation.", "opts": {"A": "The key for Nokia's success is innovation and creation.", "B": "The key to Nokia's success is innovations and creations.", "C": "The key of Nokia's success are innovation and creation.", "D": "The key to Nokia's success is its innovation and creation."}, "ans": "D", "expl": "Cụm cố định: the key TO something (không phải 'for' hay 'of'). Chủ ngữ 'the key' số ít nên động từ phải là 'is', không phải 'are'."}, {"id": "CW2.1", "cue": "Apple Inc. / be / American multinational corporation / base / California.", "opts": {"A": "Apple Inc. was an American multinational corporation based at California.", "B": "Apple Inc. was American multinational corporation based in California.", "C": "Apple Inc. is the American multinational corporation base in California.", "D": "Apple Inc. is an American multinational corporation based in California."}, "ans": "D", "expl": "Sự thật hiện tại dùng hiện tại đơn (is). Danh từ đếm được số ít lần đầu nhắc tới dùng 'an' (trước nguyên âm), không dùng 'the'. Cần dạng phân từ 'based' (đã được đặt trụ sở), không phải động từ nguyên mẫu 'base'. Giới từ chỉ vị trí trụ sở dùng IN."}, {"id": "CW2.2", "cue": "It / design / manufacture / consumer electronics / software products.", "opts": {"A": "It design and manufacture consumer electronic and software products.", "B": "It designs and manufactures consumer electronics and software products.", "C": "It is designed and manufactured consumer electronics and software products.", "D": "It designs and manufactures consumer electronic for software product."}, "ans": "B", "expl": "Chủ ngữ 'It' số ít nên động từ phải thêm 's': designs, manufactures. 'Consumer electronics' luôn ở dạng số nhiều cố định (không phải 'electronic')."}, {"id": "CW2.3", "cue": "Apple / obtain / unique reputation / consumer electronics industry.", "opts": {"A": "Apple obtain a unique reputation in the consumer electronics industry.", "B": "Apple obtains unique reputation on the consumer electronics industry.", "C": "Apple obtains a unique reputation in the consumer electronics industry.", "D": "Apple has obtained a unique reputation in consumer electronics industry."}, "ans": "C", "expl": "Chủ ngữ số ít 'Apple' cần động từ thêm 's': obtains. Danh từ đếm được số ít 'a unique reputation' cần mạo từ 'a'. Cụm cố định: reputation IN an industry, và cần 'the' trước 'consumer electronics industry' vì đây là ngành cụ thể đã xác định."}, {"id": "CW2.4", "cue": "Its goal / be / design, develop / bring good products / market.", "opts": {"A": "Its goal is design, develop and bring good products to the market.", "B": "Its goal was to design, develop and bring good products market.", "C": "Its goal is to design, develop and bring good products to the market.", "D": "Its goal is designing, developing and bringing good products for market."}, "ans": "C", "expl": "Cấu trúc: goal IS TO + V (nguyên mẫu có 'to'), ba động từ nối bằng 'and' phải song song cùng dùng chung 'to': to design, develop and bring. Cụm cố định: bring something TO the market."}, {"id": "CW2.5", "cue": "/ 2009, Apple / earn / revenue / USD8.16 billion.", "opts": {"A": "In 2009, Apple earned a revenue of USD 8.16 billion.", "B": "In 2009, Apple earns a revenue of USD8.16 billion.", "C": "In 2009, Apple has earned the revenue USD8.16 billion.", "D": "In 2009, Apple earned the revenue of USD8.16 billion."}, "ans": "A", "expl": "Mốc năm cụ thể trong quá khứ (2009) → dùng quá khứ đơn (earned), không dùng hiện tại hay hiện tại hoàn thành. Khi lần đầu nêu một con số cụ thể, dùng mạo từ KHÔNG XÁC ĐỊNH 'a revenue', không dùng 'the'."}, {"id": "CW3.1", "cue": "Vinamilk / be / biggest dairy company / Vietnam.", "opts": {"A": "Vinamilk is the biggest dairy company in Vietnam.", "B": "Vinamilk is biggest dairy company in Vietnam.", "C": "Vinamilk was the biggest dairy company in Vietnam.", "D": "Vinamilk is a biggest dairy company in Vietnam."}, "ans": "A", "expl": "So sánh nhất (biggest) luôn phải có mạo từ 'the' đứng trước, không dùng 'a'. Sự thật hiện tại dùng hiện tại đơn (is)."}, {"id": "CW3.2", "cue": "It / have / network / 183 agencies / all 64 provinces.", "opts": {"A": "It has network of 183 agencies throughout all 64 provinces.", "B": "It has a network of 183 agencies throughout all 64 provinces.", "C": "It had a network of 183 agencies throughout all 64 provinces.", "D": "It has the network of 183 agencies throughout all 64 provinces."}, "ans": "B", "expl": "Danh từ đếm được số ít lần đầu nhắc tới cần mạo từ 'a network', không được bỏ trống hoặc dùng 'the'. Sự thật hiện tại dùng hiện tại đơn (has)."}, {"id": "CW3.3", "cue": "Vinamilk / aim / satisfy / the demand / Vietnamese consumers.", "opts": {"A": "Vinamilk aim at satisfying the demand of Vietnamese consumers.", "B": "Vinamilk aims satisfy the demand of Vietnamese consumers.", "C": "Vinamilk aims at satisfying the demand of Vietnamese consumers.", "D": "Vinamilk is aim at satisfying the demand of Vietnamese consumers."}, "ans": "C", "expl": "Cụm cố định: aim AT + V-ing (không phải 'aim to V' hay thiếu 'at'). Chủ ngữ số ít 'Vinamilk' cần động từ thêm 's': aims."}, {"id": "CW3.4", "cue": "Sales / domestic market / account for / more than 80% / total sales.", "opts": {"A": "Sales in the domestic market accounts for more than 80% of the total sales.", "B": "Sales on the domestic market account for more than 80% of total sales.", "C": "Sales in domestic market account for more than 80% of the total sales.", "D": "Sales in the domestic market account for more than 80% of the total sales."}, "ans": "D", "expl": "'Sales' là chủ ngữ số nhiều nên động từ KHÔNG thêm 's': account (không phải accounts). Giới từ đúng: sales IN a market (không phải 'on'). Cần 'the' trước 'domestic market' và trước 'total sales' vì đều đã được xác định trong ngữ cảnh."}, {"id": "CW3.5", "cue": "/ 2008, Vinamilk / spend / more than VND 17 billion / charity activities.", "opts": {"A": "In 2008, Vinamilk spent more than VND 17 billion on its charity activities.", "B": "In 2008, Vinamilk has spent more than VND 17 billion on its charity activities.", "C": "In 2008, Vinamilk spent more than VND 17 billion for its charity activities.", "D": "In 2008, Vinamilk spend more than VND 17 billion for its charity activities."}, "ans": "A", "expl": "Mốc năm cụ thể (2008) → quá khứ đơn (spent), không dùng hiện tại hoàn thành. Cụm cố định: spend money ON something (không phải 'for')."}, {"id": "CW4.1", "cue": "Thien Long / be / one / the leading enterprises producing ball-point pens / stationery / Vietnam.", "opts": {"A": "Thien Long was one of the leading enterprises producing ball-point pens and stationery in Vietnam.", "B": "Thien Long is one of leading enterprises producing ball-point pens and stationery in Vietnam.", "C": "Thien Long is one of the leading enterprises producing ball-point pens and stationery in Vietnam.", "D": "Thien Long is one of the leading enterprises producing ball-point pens for stationery in Vietnam."}, "ans": "C", "expl": "Sự thật hiện tại (công ty vẫn đang hoạt động) dùng hiện tại đơn (is). Cụm 'one of the + tính từ so sánh nhất + danh từ số nhiều' luôn cần 'the'. 'Pens and stationery' là hai loại sản phẩm riêng biệt nối bằng 'and', không phải 'pens for stationery'."}, {"id": "CW4.2", "cue": "/ total annual sales volume / fluctuate / US$5 million / US$10 million.", "opts": {"A": "Its total annual sales volume fluctuate between US$5 million and US$10 million.", "B": "Its total annual sales volume is fluctuating from US$5 million to US$10 million.", "C": "Its total annual sales volume has fluctuated among US$5 million and US$10 million.", "D": "Its total annual sales volume fluctuates between US$5 million and US$10 million."}, "ans": "D", "expl": "Chủ ngữ số ít 'volume' cần động từ thêm 's': fluctuates. Diễn tả một khoảng dao động giữa 2 mốc dùng BETWEEN...AND, không dùng 'among' (chỉ dùng cho 3 đối tượng trở lên) hay 'from...to'."}, {"id": "CW4.3", "cue": "Thien Long / commit / provide / best quality products.", "opts": {"A": "Thien Long commits to providing the best quality products.", "B": "Thien Long commits providing the best quality products.", "C": "Thien Long commit to provide the best quality products.", "D": "Thien Long is committed provide the best quality products."}, "ans": "A", "expl": "Cụm cố định: commit TO + V-ing (chữ 'to' ở đây là giới từ, theo sau phải là V-ing, không phải V nguyên mẫu). Chủ ngữ số ít cần động từ thêm 's': commits."}, {"id": "CW4.4", "cue": "It / continually invest / advanced technologies / human resources development.", "opts": {"A": "It continually invested in advanced technologies and human resources development.", "B": "It has continually invested in advanced technologies and human resources development.", "C": "It has continually invest in advanced technologies and human resources development.", "D": "It continually invests on advanced technologies and human resources development."}, "ans": "B", "expl": "'Continually' (liên tục từ trước đến nay) là dấu hiệu của thì hiện tại hoàn thành, không phải quá khứ đơn. Sau 'has' phải dùng dạng phân từ V3: invested (không phải 'invest'). Cụm cố định: invest IN something, không phải 'on'."}, {"id": "CW4.5", "cue": "/ the near future, Thien Long / strive / localize / Southeast Asian markets.", "opts": {"A": "In near future, Thien Long strives to localize the Southeast Asian markets.", "B": "At the near future, Thien Long will strive localize the Southeast Asian markets.", "C": "In the near future, Thien Long will strive to localize the Southeast Asian markets.", "D": "In the near future, Thien Long will striving to localize the Southeast Asian markets."}, "ans": "C", "expl": "Cụm cố định: IN the near future (không phải 'At'), và luôn cần 'the'. Cụm: strive TO + V nguyên mẫu (cần 'to'). Sau 'will' luôn là động từ nguyên mẫu, không được chia 'striving'."}, {"id": "CW5.1", "cue": "Honda Vietnam / be / joint-venture / Honda Motor Co., Ltd, Asian Honda Motor Co. Ltd / Vietnam Engineering and Agricultural Machinery Corporation.", "opts": {"A": "Honda Vietnam is a joint-venture of Honda Motor Co., Ltd, Asian Honda Motor Co., Ltd and Vietnam Engineering and Agricultural Machinery Corporation.", "B": "Honda Vietnam is joint-venture of Honda Motor Co., Ltd, Asian Honda Motor Co., Ltd and Vietnam Engineering and Agricultural Machinery Corporation.", "C": "Honda Vietnam was a joint-venture of Honda Motor Co., Ltd, Asian Honda Motor Co., Ltd and Vietnam Engineering and Agricultural Machinery Corporation.", "D": "Honda Vietnam is a joint-venture from Honda Motor Co., Ltd, Asian Honda Motor Co., Ltd and Vietnam Engineering and Agricultural Machinery Corporation."}, "ans": "A", "expl": "Sự thật hiện tại (công ty vẫn tồn tại) dùng hiện tại đơn (is). Danh từ đếm được số ít 'a joint-venture' cần mạo từ 'a'. Cụm cố định: a joint-venture OF các bên góp vốn, không dùng 'from'."}, {"id": "CW5.2", "cue": "It / be established in 1996 / registered capital / US$100 million.", "opts": {"A": "It has been established in 1996 with the registered capital of US$100 million.", "B": "It was established in 1996 with registered capital US$100 million.", "C": "It was established in 1996 with the registered capital of US$100 million.", "D": "It had been established in 1996 with the registered capital of US$100 million."}, "ans": "C", "expl": "Mốc năm cụ thể (1996) → quá khứ đơn bị động (was established), không dùng hiện tại hoàn thành hay quá khứ hoàn thành (vì không có mốc quá khứ nào khác để so sánh trước/sau). Cụm 'with the registered capital OF' cần đủ giới từ 'of'."}, {"id": "CW5.3", "cue": "It / specialise / manufacture / and / assemble Honda brand motorcycles.", "opts": {"A": "It specialise in manufacturing and assembling Honda brand motorcycles.", "B": "It specialises in manufacturing and assembling Honda brand motorcycles.", "C": "It specialises on manufacturing and assembling Honda brand motorcycles.", "D": "It is specialised in manufacture and assemble Honda brand motorcycles."}, "ans": "B", "expl": "Chủ ngữ số ít 'It' cần động từ thêm 's': specialises. Cụm cố định: specialise IN + V-ing (không phải 'on'). Hai động từ nối 'and' phải song song cùng dạng V-ing: manufacturing and assembling."}, {"id": "CW5.4", "cue": "In the first six months of 2008, / company / deliver / 600,000 motorcycles / customers.", "opts": {"A": "In the first six months of 2008, the company has delivered 600,000 motorcycles to its customers.", "B": "In the first six months of 2008, company delivered 600,000 motorcycles to its customers.", "C": "In the first six months of 2008, the company delivered 600,000 motorcycles for its customers.", "D": "In the first six months of 2008, the company delivered 600,000 motorcycles to its customers."}, "ans": "D", "expl": "Khoảng thời gian đã kết thúc trong quá khứ (6 tháng đầu 2008) → quá khứ đơn (delivered), không dùng hiện tại hoàn thành. Cụm cố định: deliver something TO somebody (không phải 'for'). Danh từ 'company' cần mạo từ 'the'."}, {"id": "CW5.5", "cue": "It / be predicted that / number of Honda motorbikes in Vietnam / hit 33 million / the near future.", "opts": {"A": "It was predicted that the number of Honda motorbikes in Vietnam will hit 33 million in the near future.", "B": "It is predicted that the number of Honda motorbikes in Vietnam will hit 33 million in the near future.", "C": "It is predicted that number of Honda motorbikes in Vietnam hits 33 million for the near future.", "D": "It is predicted that the number of Honda motorbikes in Vietnam will hit 33 million for the near future."}, "ans": "B", "expl": "Dự đoán vẫn còn đúng ở hiện tại nên mệnh đề chính dùng hiện tại đơn bị động 'is predicted' (không phải quá khứ 'was'). Mệnh đề sau 'that' dùng tương lai 'will hit' vì nói về điều sẽ xảy ra. Cụm cố định: IN the near future (không phải 'for'), và 'the number of' luôn cần 'the'."}]</script>
